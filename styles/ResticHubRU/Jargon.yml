# Правило: без жаргона, термины из глоссария.
extends: existence
message: "Жаргон: «%s». Используйте термин из глоссария (design/style/ru-technical.md, раздел 6)."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])бэкап\p{L}*'
  - '(?:^|[^\p{L}])снапшот\p{L}*'
  - '(?:^|[^\p{L}])реп(?:а|ы|е|у|ой)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])конфиг(?:а|е|у|ом|и|ов)?(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])джоб\p{L}*'
  - '(?:^|[^\p{L}])тенант\p{L}*'
  - '(?:^|[^\p{L}])нод(?:а|ы|е|у|ой|ам|ах)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])задепло\p{L}*'
  - '(?:^|[^\p{L}])зали(?:ть|ть|вать|ли|л)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])вайтлист\p{L}*'
