# STE rule: use the active voice. A passive sentence can describe a state (ste-en.md, rule 3.5).
extends: existence
message: "'%s' looks like the passive voice. Use the active voice, or keep it for a state."
level: warning
ignorecase: true
raw:
  - '\b(?:am|is|are|was|were|be|been|being)\s+'
  - '(?:\w+ed|built|done|given|known|made|sent|shown|taken|written|kept|found|run|set|put|sold|told|held|seen|lost|got|gotten)\b'
