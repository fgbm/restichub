# STE rule: one word for one concept, no phrasal verbs, project terms.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  utilize: use
  in order to: to
  set up: configure
  carry out: do
  find out: learn
  make sure of: verify
  whitelist: allow-list
  blacklist: deny-list
  repo: repository
  repos: repositories
  config: configuration
