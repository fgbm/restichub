// Enrollment is the first contact between an agent and the control plane.
// This service is the only one without mTLS (FR-ID-05).
syntax = "proto3";

package restichub.agent.v1;

// EnrollmentService issues the first agent certificate.
service EnrollmentService {
  // Enroll exchanges a one-time token and a certificate signing request for a
  // certificate. The control plane limits the request rate (FR-ID-05).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// EnrollRequest carries the one-time token and the agent key material.
message EnrollRequest {
  // One-time enrollment token of one tenant (FR-ID-01).
  string token = 1;
  // Certificate signing request in DER (FR-ID-02).
  bytes csr_der = 2;
  // Host name of the agent.
  string hostname = 3;
  // Operating system, for example "linux" or "windows".
  string os = 4;
  // Processor architecture, for example "x86_64" or "aarch64".
  string arch = 5;
  // Agent version in semantic versioning form (FR-AG-11).
  string agent_version = 6;
}

// EnrollResponse carries the identity and the trust material of the agent.
message EnrollResponse {
  // Identifier of the new agent.
  string agent_id = 1;
  // Identifier of the tenant that owns the agent (FR-TN-03).
  string tenant_id = 2;
  // Agent certificate in DER. It contains the agent ID and the tenant ID.
  bytes certificate_der = 3;
  // Certificate authority chain in DER, from the issuer to the root.
  repeated bytes ca_chain_der = 4;
  // Public job signing keys that the agent must trust (FR-PR-04).
  repeated JobSigningPublicKey job_signing_keys = 5;
}

// JobSigningPublicKey is one public key that verifies signed jobs (ADR-0005).
message JobSigningPublicKey {
  // Identifier of the key. The control plane sends it with each job.
  string key_id = 1;
  // Ed25519 public key, 32 bytes.
  bytes public_key = 2;
}
