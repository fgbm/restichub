name: CI

on:
  push:
    branches: [main]
  # The label `ci-heavy` starts the heavy jobs (`backends`, `canary-windows`) on a pull request.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main must not cancel the run that is already in progress; only a
  # new push to the same pull request replaces the previous run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  VALE_VERSION: 3.24.0
  # Line tables keep the panic backtraces. Full debug information makes the compile, the link and
  # the cache of the many test binaries much slower, most of all on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Decides which jobs a pull request needs. A job that this job skips with `if:` reports
  # "skipped", which satisfies a required check. Do not skip a job that has a matrix: a skipped
  # matrix job reports the unexpanded name, and the required check never completes. A push to
  # main runs everything, because the images and the packages depend on it.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      windows: ${{ steps.groups.outputs.windows }}
      ui: ${{ steps.groups.outputs.ui }}
      openapi: ${{ steps.groups.outputs.openapi }}
      proto: ${{ steps.groups.outputs.proto }}
      docs: ${{ steps.groups.outputs.docs }}
      site: ${{ steps.groups.outputs.site }}
      comments: ${{ steps.groups.outputs.comments }}
      deps: ${{ steps.groups.outputs.deps }}
      agent-packages: ${{ steps.groups.outputs.agent-packages }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the classifier
        run: python3 -I scripts/test-ci-changes.py
      - name: Classify the changed files
        id: groups
        env:
          # The toolchain file would install the pinned Rust only to read the crate list.
          RUSTUP_TOOLCHAIN: stable
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python3 -I scripts/ci-changes.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            python3 -I scripts/ci-changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  # The agent tests that run the real restic need the pinned release. The job fetches it with the
  # test script in `packaging`, which verifies the signed checksums and the archive hash, so the
  # Windows runner needs no gpg.
  restic:
    name: Restic (${{ matrix.restic }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        restic: [linux, windows]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and verify restic
        run: >-
          packaging/fetch-restic.sh
          --os "${{ matrix.restic }}" --arch amd64
          --output "$RUNNER_TEMP/restic"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restic-ci-${{ matrix.restic }}
          path: |
            ${{ runner.temp }}/restic/restic
            ${{ runner.temp }}/restic/restic.exe
          retention-days: 1
          if-no-files-found: error

  rust-linux:
    name: Rust (ubuntu-latest)
    needs: [changes, restic]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restic-ci-linux
          path: ${{ runner.temp }}/restic
      # The tests fail, and do not skip, when this restic is missing.
      - name: Use the verified restic
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/restic/restic"
          chmod +x "$binary"
          "$binary" version
          echo "RESTICHUB_TEST_RESTIC=$binary" >> "$GITHUB_ENV"
          echo "RESTICHUB_REQUIRE_RESTIC=1" >> "$GITHUB_ENV"
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # A broken doc link or an invalid doc comment fails the build, so it never reaches the site.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      # The database tests skip here because RESTICHUB_TEST_DATABASE_URL is not set. The
      # `database` job runs them.
      - name: Test
        run: cargo test --workspace
      # The database tests are inside the crate behind the test-util feature. A build without the
      # feature must still compile them.
      - name: Check that the database tests are compiled
        run: |
          set -euo pipefail
          count=$(cargo test -p restichub-db -- --list | grep -c '^tests::' || true)
          echo "database tests: $count"
          test "$count" -gt 0
      # The test helper is a dev-only feature. No binary crate may enable it in the normal graph.
      - name: Check that the test helper is not a normal dependency
        run: |
          set -euo pipefail
          for crate_dir in crates/*; do
            if [ -f "$crate_dir/src/main.rs" ]; then
              crate=$(basename "$crate_dir")
              if cargo tree -e normal -p "$crate" -f '{p} {f}' | grep -q 'restichub-db.*test-util'; then
                echo "::error::$crate enables restichub-db test-util in the normal dependency graph"
                exit 1
              fi
            fi
          done
          echo "no binary crate enables the test helper in the normal graph"

  # The control plane runs only in a Linux container, so the Windows job builds and tests only the
  # agent and the crates that the agent needs in a normal or build dependency. The `changes` job
  # gives this crate list. A pull request runs the job only when one of these crates changes. A
  # push to main runs it always.
  rust-windows:
    name: Rust (windows-latest)
    needs: [changes, restic]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restic-ci-windows
          path: ${{ runner.temp }}/restic
      # The tests fail, and do not skip, when this restic is missing.
      - name: Use the verified restic
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/restic/restic.exe"
          "$binary" version
          echo "RESTICHUB_TEST_RESTIC=$binary" >> "$GITHUB_ENV"
          echo "RESTICHUB_REQUIRE_RESTIC=1" >> "$GITHUB_ENV"
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the tests
        run: cargo test ${{ needs.changes.outputs.agent-packages }} --no-run
      - name: Test
        run: cargo test ${{ needs.changes.outputs.agent-packages }}

  # A service container runs only on a Linux runner, so the database tests are their own job.
  database:
    name: Database (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTICHUB_TEST_DATABASE_URL: postgres://restichub:restichub@localhost:5432/restichub
    steps:
      - uses: actions/checkout@v7
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      # The real promtool checks the metrics exposition in the test `ac_mn_03_...` (AC-MN-03). The
      # archive hash is the one that the release page publishes.
      - name: Install promtool
        run: |
          set -euo pipefail
          version=3.5.0
          archive="prometheus-${version}.linux-amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$archive" "https://github.com/prometheus/prometheus/releases/download/v${version}/${archive}"
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "prometheus-${version}.linux-amd64/promtool"
          echo "RESTICHUB_TEST_PROMTOOL=$RUNNER_TEMP/prometheus-${version}.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "RESTICHUB_REQUIRE_PROMTOOL=1" >> "$GITHUB_ENV"
      # nextest runs the tests of all binaries side by side, and the test helper shares one template
      # database across the processes. It does not run the doc tests; the Rust job runs them.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest
      - name: Build the tests
        run: cargo test --workspace --no-run
      # The run includes the crash recovery test (AC-NFR-02): it kills the real control plane binary
      # with SIGKILL while 50 jobs run.
      - name: Test
        run: cargo nextest run --workspace --profile ci
      # The openssl chain check prints its result line; --nocapture puts the line in this log.
      # The filter keeps the workspace feature set, so the step reuses the build of the first step.
      - name: Show the openssl chain check
        run: >-
          cargo nextest run --workspace --profile ci --no-capture
          -E 'binary(pki_certs) & test(openssl_verifies_the_issued_chain)'

  # The heavy jobs run on a push to main and on a pull request with the label `ci-heavy`.
  # The real restic works against an S3 server and a rest-server (AC-RP-01). MinIO no longer
  # publishes images or binaries, so the S3 side is SeaweedFS, pinned by digest.
  backends:
    name: Backends (S3, rest-server)
    needs: restic
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-heavy')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTICHUB_TEST_DATABASE_URL: postgres://restichub:restichub@localhost:5432/restichub
      RESTICHUB_REQUIRE_RESTIC: "1"
      RESTICHUB_REQUIRE_BACKENDS: "1"
      RESTICHUB_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      RESTICHUB_TEST_S3_ACCESS_KEY: ci-access
      RESTICHUB_TEST_S3_SECRET_KEY: ci-secret-key
      RESTICHUB_TEST_S3_BUCKET: ci-bucket
      RESTICHUB_TEST_REST_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restic-ci-linux
          path: ${{ runner.temp }}/restic
      - name: Use the verified restic
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/restic/restic"
          "$RUNNER_TEMP/restic/restic" version
          echo "RESTICHUB_TEST_RESTIC=$RUNNER_TEMP/restic/restic" >> "$GITHUB_ENV"
      - name: Start the S3 server and the rest-server
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/s3.json" <<'JSON'
          {"identities":[{"name":"ci","credentials":[{"accessKey":"ci-access","secretKey":"ci-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name s3 -p 127.0.0.1:8333:8333 -v "$RUNNER_TEMP/s3.json:/s3.json:ro" \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -s3 -s3.config=/s3.json
          docker run -d --name rest -p 127.0.0.1:8000:8000 -e OPTIONS="--no-auth" restic/rest-server:0.14.0
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8333/ && curl -s -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user ci-access:ci-secret-key http://127.0.0.1:8333/ci-bucket
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Test the real restic against the backends
        run: cargo test -p restichub-agent --test restic_backends
      - name: Show the server logs on failure
        if: failure()
        run: |
          docker logs s3 | tail -n 50
          docker logs rest | tail -n 50

  # The registry and the process arguments of a Windows host hold no canary after the jobs
  # (AC-AG-03, AC-AG-04).
  canary-windows:
    name: Canary scan (windows-latest)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-heavy')
    runs-on: windows-latest
    env:
      RESTICHUB_HOST_CANARY: "1"
    steps:
      - uses: actions/checkout@v7
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the fake restic
        run: cargo build -p restichub-agent --examples
      - name: Scan the host
        run: cargo test -p restichub-agent --test canary_host -- --nocapture

  # The UI types come from the OpenAPI document that the control plane serves. The job generates
  # the document from the current source and compares it with the committed `ui/src/lib/api/schema.d.ts`,
  # so a route change without a regenerated schema fails the check. The database is the smallest
  # one that starts the control plane; the job touches no data.
  openapi:
    name: OpenAPI drift (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the control plane
        run: cargo build -p restichub-cp
      # The runner image already holds `psql` in most cases; the install is only a fallback.
      - name: Install the PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Prepare the database
        env:
          PGPASSWORD: restichub
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U restichub -d postgres -v ON_ERROR_STOP=1 \
            -v app_role=restichub_app -v auth_role=restichub_auth \
            -v owner_role=restichub_owner -v runtime_role=restichub_runtime \
            -f crates/restichub-db/sql/bootstrap-roles.sql
          psql -h 127.0.0.1 -U restichub -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE restichub_owner PASSWORD 'owner';
          ALTER ROLE restichub_runtime PASSWORD 'runtime';
          ALTER DATABASE restichub OWNER TO restichub_owner;
          SQL
          RESTICHUB_DATABASE_MIGRATION_URL=postgres://restichub_owner@127.0.0.1:5432/restichub \
          RESTICHUB_DATABASE_MIGRATION_PASSWORD=owner \
            ./target/debug/restichub-cp migrate
      - name: Serve the control plane and write the OpenAPI document
        run: |
          set -euo pipefail
          export RESTICHUB_LISTEN_ADDR=127.0.0.1:8080
          export RESTICHUB_DATABASE_URL=postgres://restichub_runtime@127.0.0.1:5432/restichub
          export RESTICHUB_DATABASE_PASSWORD=runtime
          # This key is ephemeral: it encrypts nothing that outlives the job.
          export RESTICHUB_KEK="$(head -c 32 /dev/urandom | base64)"
          # The job reaches the control plane over plain HTTP on the loopback address only.
          export RESTICHUB_SERVER_INSECURE_COOKIES=true
          ./target/debug/restichub-cp serve >"$RUNNER_TEMP/cp.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/openapi.json -o "$RUNNER_TEMP/openapi.json"
      - name: Compare the committed UI types with the generated ones
        working-directory: ui
        run: |
          set -euo pipefail
          npm ci
          OPENAPI_URL="$RUNNER_TEMP/openapi.json" npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

  cargo-deny:
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Check for unused dependencies
        run: cargo machete

  proto:
    name: Protocol Buffers
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          input: proto
          lint: true
          format: false
          # Enable after proto/ exists on main.
          breaking: false
          breaking_against: https://github.com/${{ github.repository }}.git#format=git,branch=main,subdir=proto
          push: false
          pr_comment: false

  docs:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  vale:
    name: Style (Vale)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check text
        run: vale --minAlertLevel=error README.md CONTRIBUTING.md SECURITY.md design docs/src
      - name: Check procedure step length
        run: python3 -I scripts/check-step-length.py docs/src

  comments:
    name: Style (comments)
    needs: changes
    if: needs.changes.outputs.comments == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      # The second run proves that the check is not a no-op: the fixture must be flagged.
      - name: Check comments
        run: |
          scripts/check-comments.sh
          if COMMENT_CHECK_DIRS=scripts/testdata/comments scripts/check-comments.sh; then
            echo "::error::check-comments.sh did not flag the fixture"
            exit 1
          fi

  ui:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ui-csp:
    name: Web UI CSP
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # The mock service serves the data, so the test drives the screens without a control plane.
      - run: VITE_USE_MOCK=true npm run build
      - run: npm run test:e2e
