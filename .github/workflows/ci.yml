name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VALE_VERSION: 3.24.0

jobs:
  rust-linux:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTICHUB_TEST_DATABASE_URL: postgres://restichub:restichub@localhost:5432/restichub
    steps:
      - uses: actions/checkout@v5
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The database tests are inside the crate behind the test-util feature. A build without the
      # feature must still compile them (N8).
      - name: Check that the database tests are compiled
        shell: bash
        run: |
          set -euo pipefail
          count=$(cargo test -p restichub-db -- --list | grep -c 'tests::db_' || true)
          echo "database tests: $count"
          test "$count" -gt 0
      # The test helper is a dev-only feature. No binary crate may enable it in the normal graph
      # (D8, N11).
      - name: Check that the test helper is not a normal dependency
        shell: bash
        run: |
          set -euo pipefail
          for crate_dir in crates/*; do
            if [ -f "$crate_dir/src/main.rs" ]; then
              crate=$(basename "$crate_dir")
              if cargo tree -e normal -p "$crate" -f '{p} {f}' | grep -q 'restichub-db.*test-util'; then
                echo "::error::$crate enables restichub-db test-util in the normal dependency graph"
                exit 1
              fi
            fi
          done
          echo "no binary crate enables the test helper in the normal graph"

  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The database tests skip on Windows because RESTICHUB_TEST_DATABASE_URL is not set.
      - name: Test
        run: cargo test --workspace

  cargo-deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  proto:
    name: Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          input: proto
          lint: true
          format: false
          # Enable after proto/ exists on main.
          breaking: false
          breaking_against: https://github.com/${{ github.repository }}.git#format=git,branch=main,subdir=proto
          push: false
          pr_comment: false

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  vale:
    name: Style (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Vale
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check text
        run: vale --minAlertLevel=error README.md CONTRIBUTING.md SECURITY.md design docs/src
