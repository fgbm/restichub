name: Images

# Publish the control plane image after CI passes on main.
#
# The workflow starts from the CI completion event, not from a second build of
# the same commits. The image is published only for a green main, and the build
# and push steps never run for a pull request. The checkout uses the commit that
# CI tested, so the image holds the tested tree. Each green commit gets the
# immutable tag sha-<full sha>; the tag edge only moves forward.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cp

jobs:
  image:
    name: Publish the control plane image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # One group for each commit, so a newer commit never cancels the publish of
    # an older one. The stage deploy pins the image of a commit.
    concurrency:
      group: images-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute the image tags
        id: vars
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
          # The source label links the GHCR package to the public repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=ResticHub control plane
            org.opencontainers.image.description=The ResticHub control plane.
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            RESTICHUB_BUILD_VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  edge:
    name: Move the edge tag
    needs: image
    runs-on: ubuntu-latest
    # Edge moves one run at a time, and a running move is never cancelled. A
    # newer waiting run replaces an older waiting one, so each run also tries
    # the tip of main.
    concurrency:
      group: images-edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A CI run of an older commit can finish after a newer one. Edge moves
      # only forward: to a commit that has the commit of the current edge as an
      # ancestor.
      - name: Move edge forward
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          revision() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty'
          }
          current=$(revision "${image}:edge" || true)
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          for candidate in "$tip" "$HEAD_SHA"; do
            if [ -z "$(revision "${image}:sha-${candidate}" || true)" ]; then
              echo "::notice::sha-${candidate} is not published yet."
              continue
            fi
            if [ "$candidate" = "$current" ]; then
              echo "::notice::edge already points to ${candidate}."
              exit 0
            fi
            if [ -n "$current" ] && ! git merge-base --is-ancestor "$current" "$candidate"; then
              echo "::notice::${candidate} does not descend from the edge commit ${current}."
              continue
            fi
            docker buildx imagetools create --tag "${image}:edge" "${image}:sha-${candidate}"
            echo "::notice::edge moved from ${current:-nothing} to ${candidate}."
            exit 0
          done
          echo "::notice::edge stays at ${current:-nothing}."
