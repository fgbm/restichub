name: Install smoke (AC-IN-03)

# Installs the agent as a real operating system service on a runner, enrolls it with a control
# plane that runs on the same runner, and checks that the service starts and connects, also after
# a restart. The reboot part of AC-IN-03 stays a manual check.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/restichub-agent/**
      - crates/restichub-common/**
      - crates/restichub-compiler/**
      - crates/restichub-cp/**
      - crates/restichub-db/**
      - crates/restichub-proto/**
      - crates/restichub-secrets/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - packaging/**
      - scripts/install-smoke.sh
      - scripts/install-smoke-windows.ps1
      - .github/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Install smoke (AC-IN-03) / Linux systemd
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set the state directory
        shell: bash
        run: echo "SMOKE_DIR=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/smoke" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the control plane and the agent
        run: cargo build -p restichub-cp -p restichub-agent -p restichub-canary-scan
      - name: Prepare the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: restichub
          PGPASSWORD: restichub
          CP_BIN: target/debug/restichub-cp
        run: scripts/install-smoke.sh db-prepare
      - name: Start the control plane and create the token
        env:
          CP_BIN: target/debug/restichub-cp
        run: scripts/install-smoke.sh cp-up
      - name: Prepare /opt and the download folder
        run: |
          # The runner image makes /opt world-writable with a default ACL for the runner account.
          # The agent refuses such a location (T20), so the step restores a normal root-owned /opt.
          sudo chmod 0755 /opt
          sudo setfacl -b /opt
          ls -ld /opt
          mkdir -p "$HOME/Downloads"
          cp target/debug/restichub-agent "$HOME/Downloads/restichub-agent"
      - name: Register the agent from the download folder
        run: |
          set -euo pipefail
          scripts/install-smoke.sh ca
          sudo "$HOME/Downloads/restichub-agent" register --url "https://localhost:8443" \
            --token-file "$SMOKE_DIR/enrollment-token" --ca-file "$SMOKE_DIR/ca.pem"
      - name: The agent installed itself into the program directory
        run: |
          set -euo pipefail
          test -x /opt/restichub-agent/bin/restichub-agent
          test -x /opt/restichub-agent/bin/restic
          test "$(stat -c '%U %a' /opt/restichub-agent)" = "root 755"
          grep -q '/opt/restichub-agent/bin/restichub-agent' /etc/systemd/system/restichub-agent.service
          sudo /opt/restichub-agent/bin/restichub-agent status
      - name: The service is enabled, active and connected
        run: |
          set -euo pipefail
          test "$(systemctl is-enabled restichub-agent)" = enabled
          test "$(systemctl is-active restichub-agent)" = active
          scripts/install-smoke.sh connected 0 60
      - name: The service connects again after a restart
        run: |
          set -euo pipefail
          since="$(date -u +%s)"
          sudo systemctl restart restichub-agent
          test "$(systemctl is-active restichub-agent)" = active
          scripts/install-smoke.sh connected "$since" 60
      # ProtectHome=read-only wins over ReadWritePaths on the same path, so the restore guide gives
      # no in-place restore below /home and /root. A root-owned directory below /home is writable,
      # which a repository root needs. The check uses the file, not the exit code of systemd-run.
      - name: ReadWritePaths lifts ProtectHome=read-only only below /home and /root (ADR-0045)
        run: |
          set -euo pipefail
          below="$(sudo mktemp -d /home/restichub-smoke.XXXXXX)"
          failed=0
          for case in "/home /home no" "/root /root no" "$below $below yes" "/ /root no"; do
            read -r writable dir expected <<<"$case"
            file="$dir/restichub-smoke-file"
            sudo systemd-run --quiet --wait --collect -p ProtectSystem=strict \
              -p ProtectHome=read-only -p "ReadWritePaths=$writable" touch "$file" || true
            if sudo test -f "$file"; then actual=yes; else actual=no; fi
            sudo rm -f "$file"
            echo "ReadWritePaths=$writable: $dir writable: $actual (expected $expected)"
            if [ "$actual" != "$expected" ]; then failed=1; fi
          done
          sudo rmdir "$below"
          exit "$failed"
      - name: A local repository below a repository root inits and backs up (ADR-0045)
        run: |
          set -euo pipefail
          root=/srv/restichub-smoke-repositories
          # A root below a directory of the runner account and a system directory are refused.
          mkdir -p "$SMOKE_DIR/repositories"
          for refused in "$SMOKE_DIR/repositories" /etc; do
            echo "$refused" | sudo tee /etc/restichub-agent-repository-roots.txt >/dev/null
            sudo chmod 0644 /etc/restichub-agent-repository-roots.txt
            if output="$(sudo /opt/restichub-agent/bin/restichub-agent install-service 2>&1)"; then
              echo "install-service must refuse the repository root $refused" >&2
              exit 1
            fi
            echo "$output" | grep -q "$refused"
          done
          echo "$root" | sudo tee /etc/restichub-agent-repository-roots.txt >/dev/null
          sudo chmod 0644 /etc/restichub-agent-repository-roots.txt
          since="$(date -u +%s)"
          sudo /opt/restichub-agent/bin/restichub-agent install-service
          test "$(sudo stat -c '%U %a' "$root")" = "root 700"
          grep -q "\"$root\"" /etc/systemd/system/restichub-agent.service
          scripts/install-smoke.sh connected "$since" 60
          mkdir -p "$SMOKE_DIR/source"
          echo "local repository smoke" >"$SMOKE_DIR/source/file.txt"
          scripts/install-smoke.sh local-repository "$root" "$SMOKE_DIR/source" /var/tmp/restichub-outside/local-test
      # The service runs restic with the sandbox of its unit, so restic runs here with the same
      # properties. The jobs of the service above show that the agent itself runs in it.
      - name: restic runs each command of a job in the sandbox of the unit (AC-IN-03)
        run: |
          set -euo pipefail
          unit=/etc/systemd/system/restichub-agent.service
          grep -qx 'SystemCallFilter=@system-service' "$unit"
          grep -qx 'SystemCallErrorNumber=EPERM' "$unit"
          grep -qx 'ProtectProc=invisible' "$unit"
          properties=()
          while IFS= read -r line; do
            case "$line" in
              '' | '['* | Description=* | After=* | Wants=* | WantedBy=* | Type=* | ExecStart=* | Restart*) ;;
              *) properties+=(-p "$line") ;;
            esac
          done <"$unit"
          repository=/srv/restichub-smoke-repositories/sandbox
          target=/srv/restichub-smoke-repositories/sandbox-restore
          sandboxed() {
            sudo systemd-run --wait --pipe --quiet "${properties[@]}" \
              -E RESTIC_PASSWORD=smoke-sandbox -E RESTIC_REPOSITORY="$repository" \
              /opt/restichub-agent/bin/restic "$@"
          }
          sandboxed init
          sandboxed backup "$SMOKE_DIR/source"
          sandboxed backup "$SMOKE_DIR/source"
          sandboxed snapshots
          sandboxed ls latest
          sandboxed restore latest --target "$target"
          sudo test -f "$target$SMOKE_DIR/source/file.txt"
          sandboxed forget --keep-last 1
          sandboxed prune
          sandboxed check
          sudo rm -rf "$repository" "$target"
      # The service writes its log to journald. The scan reads the entries of all units.
      - name: journald holds no canary after ten jobs (AC-AG-03)
        run: |
          set -euo pipefail
          since="$(date -u +%s)"
          # The restart puts the greeting of the service into the scanned window.
          sudo systemctl restart restichub-agent
          scripts/install-smoke.sh connected "$since" 60
          canaries="$SMOKE_DIR/canaries"
          for _ in 1 2 3; do echo "CANARY-$(cat /proc/sys/kernel/random/uuid)"; done >"$canaries"
          scripts/install-smoke.sh canary-jobs "$canaries" /srv/restichub-smoke-repositories/canary
          control="CANARY-$(cat /proc/sys/kernel/random/uuid)"
          echo "control line $control" | systemd-cat --identifier restichub-canary-control
          journal="$SMOKE_DIR/journal.export"
          for _ in $(seq 1 30); do
            sudo journalctl --no-pager --output=export --since "@$since" >"$journal"
            if grep -q "$control" "$journal"; then break; fi
            sleep 1
          done
          echo "--- the lines of the service in the scanned window"
          sudo journalctl --no-pager --output=cat --since "@$since" -u restichub-agent
          lines="$(sudo journalctl --no-pager --output=cat --since "@$since" -u restichub-agent | grep -c 'the control plane greeted the agent' || true)"
          if [ "$lines" -lt 1 ]; then echo "the journal holds no line of the service"; exit 1; fi
          code=0
          target/debug/restichub-canary-scan --canary "$control" --file "$journal" >/dev/null || code=$?
          if [ "$code" -ne 1 ]; then echo "the scan must find the control line (exit $code)"; exit 1; fi
          target/debug/restichub-canary-scan --canary-file "$canaries" --file "$journal"
      - name: Diagnostics
        if: failure()
        run: |
          sudo systemctl status restichub-agent --no-pager || true
          sudo journalctl -u restichub-agent --no-pager | tail -50 || true
          echo "--- control plane log"
          scripts/install-smoke.sh cp-logs | tail -80 || true

  windows:
    name: Install smoke (AC-IN-03) / Windows service
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set the state directory
        shell: bash
        run: echo "SMOKE_DIR=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/smoke" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the control plane and the agent
        run: cargo build -p restichub-cp -p restichub-agent -p restichub-canary-scan
      # The runner holds PostgreSQL but no container engine. A fresh cluster in a temporary
      # directory does not depend on the version or the credentials of the installed one.
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          pg_bin="$(ls -d "/c/Program Files/PostgreSQL/"*/bin | sort -V | tail -n1)"
          echo "$pg_bin" >> "$GITHUB_PATH"
          export PATH="$pg_bin:$PATH"
          pg_data="$(cygpath -w "$RUNNER_TEMP/pgdata")"
          initdb -D "$pg_data" -U restichub -A trust -E UTF8
          pg_ctl -D "$pg_data" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -c listen_addresses=127.0.0.1" -w start
          createdb -h 127.0.0.1 -U restichub restichub
      - name: Prepare the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: restichub
          CP_BIN: target/debug/restichub-cp.exe
        run: scripts/install-smoke.sh db-prepare
      - name: Start the control plane and create the token
        env:
          CP_BIN: target/debug/restichub-cp.exe
          # A key that starts with "/" is the value that Git Bash converted to a path.
          SMOKE_KEK: /wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: scripts/install-smoke.sh cp-up
      - name: Register the agent from a user folder
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL="$(cygpath -u "$PROGRAMFILES")/Git/usr/bin/openssl.exe" scripts/install-smoke.sh ca
          mkdir -p "$USERPROFILE/Downloads"
          cp target/debug/restichub-agent.exe "$USERPROFILE/Downloads/restichub-agent.exe"
          "$USERPROFILE/Downloads/restichub-agent.exe" register --url "https://localhost:8443" \
            --token-file "$(cygpath -w "$SMOKE_DIR/enrollment-token")" \
            --ca-file "$(cygpath -w "$SMOKE_DIR/ca.pem")"
      - name: The agent installed itself under Program Files
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          if (-not (Test-Path "$dir\restichub-agent.exe")) { throw 'agent missing' }
          if (-not (Test-Path "$dir\restic.exe")) { throw 'restic missing' }
          if (Test-Path "$dir\bin") { throw 'the bin directory exists' }
          & "$dir\restichub-agent.exe" status
          if ($LASTEXITCODE -ne 0) { throw "status exit code $LASTEXITCODE" }
      - name: The service is running, automatic, LocalSystem and connected
        shell: pwsh
        run: |
          $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
          $service | Format-List Name, State, StartMode, StartName
          if ($service.State -ne 'Running') { throw "state: $($service.State)" }
          if ($service.StartMode -ne 'Auto') { throw "start mode: $($service.StartMode)" }
          if ($service.StartName -ne 'LocalSystem') { throw "account: $($service.StartName)" }
          bash scripts/install-smoke.sh connected 0 60
      - name: The service connects again after a restart
        shell: pwsh
        run: |
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Restart-Service restichub-agent
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
      - name: An install with restic in an old location migrates
        shell: pwsh
        run: |
          . scripts/install-smoke-windows.ps1
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          $agent = Join-Path $dir 'restichub-agent.exe'
          $restic = Join-Path $dir 'restic.exe'
          $olds = @(
            (Join-Path $dir 'bin'),
            (Join-Path $env:ProgramData 'ResticHub\Agent\bin')
          )
          foreach ($old in $olds) {
            $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $hash = (Get-FileHash $restic -Algorithm SHA256).Hash
            Stop-AgentService
            New-Item -ItemType Directory -Force $old | Out-Null
            Move-Item $restic (Join-Path $old 'restic.exe')
            & $agent install-service
            if ($LASTEXITCODE -ne 0) { throw "install-service exit code $LASTEXITCODE" }
            if (-not (Test-Path $restic)) { throw "restic not moved from $old" }
            if ((Get-FileHash $restic -Algorithm SHA256).Hash -ne $hash) { throw 'hash changed by the move' }
            if (Test-Path $old) { throw "$old still exists" }
            if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
            bash scripts/install-smoke.sh connected $since 60
          }
          & $agent status
          if ($LASTEXITCODE -ne 0) { throw "status exit code $LASTEXITCODE" }
      - name: The service moves restic by itself at the start
        shell: pwsh
        run: |
          . scripts/install-smoke-windows.ps1
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          $restic = Join-Path $dir 'restic.exe'
          $olds = @(
            (Join-Path $dir 'bin'),
            (Join-Path $env:ProgramData 'ResticHub\Agent\bin')
          )
          foreach ($old in $olds) {
            $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            Stop-AgentService
            New-Item -ItemType Directory -Force $old | Out-Null
            Move-Item $restic (Join-Path $old 'restic.exe')
            Start-Service restichub-agent
            # The service reports Running before its start code runs.
            for ($i = 0; $i -lt 60 -and -not ((Test-Path $restic) -and -not (Test-Path $old)); $i++) { Start-Sleep -Seconds 1 }
            if (-not (Test-Path $restic)) {
              Get-Service restichub-agent | Format-List Status
              & (Join-Path $dir 'restichub-agent.exe') status
              throw "restic not moved by the service from $old"
            }
            if (Test-Path $old) { throw "$old still exists" }
            bash scripts/install-smoke.sh connected $since 60
          }
      - name: The service starts when an old restic file stays in place
        shell: pwsh
        run: |
          . scripts/install-smoke-windows.ps1
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          $old = Join-Path $dir 'bin\restic.exe'
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Stop-AgentService
          New-Item -ItemType Directory -Force (Join-Path $dir 'bin') | Out-Null
          Copy-Item (Join-Path $dir 'restic.exe') $old
          attrib +r $old
          Start-Service restichub-agent
          bash scripts/install-smoke.sh connected $since 60
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          # The service may remove the old file at any time, so a missing file is fine. A failed
          # attrib must not leave its exit code as the exit code of the step.
          if (Test-Path $old) {
            attrib -r $old 2>$null | Out-Null
            Remove-Item $old -Force -ErrorAction SilentlyContinue
          }
          $bin = Join-Path $dir 'bin'
          if (Test-Path $bin) { Remove-Item $bin -Force -ErrorAction SilentlyContinue }
          $global:LASTEXITCODE = 0
      - name: A second install-service works while the service runs (FR-IN-08)
        shell: pwsh
        run: |
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $agent = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          & $agent install-service
          if ($LASTEXITCODE -ne 0) { throw "install-service exit code $LASTEXITCODE" }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
      # File Explorer adds an entry for a non-elevated administrator who opens an agent folder.
      # The service removes it at its start and continues (ADR-0048, ADR-0049, AC-AG-15).
      - name: The Explorer access of an administrator does not stop the service (ADR-0048)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tree = Join-Path $env:ProgramFiles 'ResticHub'
          $program = Join-Path $tree 'Agent'
          $data = Join-Path $env:ProgramData 'ResticHub'
          $config = Join-Path $data 'Agent'
          $cache = Join-Path $config 'cache'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $userAce = { param($path) (Get-Acl $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { $_.IdentityReference.Value -eq $user } }
          $restic = Join-Path $program 'restic.exe'
          $hash = (Get-FileHash $restic).Hash
          # A child without a protected access control list takes a copy of the entry.
          $previous = Join-Path $program 'restic-previous.exe'
          Copy-Item $restic $previous
          if (-not (Test-Path $cache)) { throw "the agent has no cache directory: $cache" }
          $blob = Join-Path $cache 'blob-inherited'
          Set-Content $blob 'x'
          foreach ($path in $previous, $blob) {
            icacls $path /setowner '*S-1-5-32-544' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $path exit code $LASTEXITCODE" }
          }
          $start = [DateTime]::Now
          foreach ($path in $tree, $program, $data, $config, $cache) {
            icacls $path /grant "*${user}:(OI)(CI)(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $path exit code $LASTEXITCODE" }
          }
          foreach ($path in $tree, $program, $data, $config, $cache, $previous, $blob) {
            if (-not (& $userAce $path)) { throw "the test did not open the access of $path" }
          }
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Restart-Service restichub-agent
          bash scripts/install-smoke.sh connected $since 60
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          # A directory and each child that inherited the entry lose it.
          foreach ($path in $tree, $program, $data, $config, $cache, $previous, $blob) {
            if (& $userAce $path) { throw "the entry of the administrator stays on $path" }
          }
          foreach ($path in $tree, $program, $data, $config, $cache) {
            if (-not (Get-Acl $path).AreAccessRulesProtected) { throw "$path is not protected" }
            $refusal = Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'removed the access of' -and $_.Message -match "$([regex]::Escape($path)):" } | Select-Object -First 1
            if (-not $refusal) { throw "the ResticHub log holds no warning for $path" }
            Write-Host "event: $($refusal.Message)"
            if ($path -eq $config -and $refusal.Message -notmatch 'identity was exposed') { throw 'the warning for the identity directory does not tell the exposure' }
          }
          Remove-Item $previous, $blob -Force
          # Users read and run the program files; the data stays closed to them.
          $users = (Get-Acl $tree).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
            Where-Object { $_.IdentityReference.Value -eq 'S-1-5-32-545' -and $_.FileSystemRights -match 'ReadAndExecute' }
          if (-not $users) { throw 'the program tree grants Users no read and execute access' }
          $foreign = (Get-Acl $data).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
            Where-Object { $_.IdentityReference.Value -notin 'S-1-5-18', 'S-1-5-32-544' }
          if ($foreign) { throw "the data tree grants another account an access: $($foreign.IdentityReference -join ', ')" }
          # The service verifies restic and the identity again before it continues.
          if ((Get-FileHash $restic).Hash -ne $hash) { throw 'restic changed' }
          $record = Get-Content (Join-Path $data 'Agent\restic.json') | ConvertFrom-Json
          if ($record.sha256 -ne $hash.ToLower()) { throw 'restic does not match its record' }
      # An entry that File Explorer adds while the service runs: the next break of the stream ends
      # the process with an error, the service manager starts it again, and the start removes the
      # entry (ADR-0049, AC-AG-15).
      - name: The Explorer access of an administrator while the service runs, and a stream break (ADR-0049)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $config = Join-Path $env:ProgramData 'ResticHub\Agent'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
          if ($service.State -ne 'Running') { throw "state: $($service.State)" }
          Set-Content "$env:SMOKE_DIR/running-heal" "$($service.ProcessId) $([DateTime]::Now.ToString('o')) $([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
          icacls $config /grant "*${user}:(OI)(CI)(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls $config exit code $LASTEXITCODE" }
          $listener = Get-NetTCPConnection -LocalPort 8443 -State Listen
          Stop-Process -Id $listener.OwningProcess -Force
      - name: Start the control plane again
        env:
          CP_BIN: target/debug/restichub-cp.exe
        run: scripts/install-smoke.sh cp-serve
      - name: The service starts again and removes the entry (ADR-0049)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $config = Join-Path $env:ProgramData 'ResticHub\Agent'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $userAce = { param($path) (Get-Acl $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { $_.IdentityReference.Value -eq $user } }
          $before, $stamp, $since = (Get-Content "$env:SMOKE_DIR/running-heal") -split ' '
          $start = [DateTime]::Parse($stamp)
          $service = $null
          for ($i = 0; $i -lt 120; $i++) {
            $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
            if ($service.State -eq 'Running' -and "$($service.ProcessId)" -ne $before -and -not (& $userAce $config)) { break }
            Start-Sleep -Seconds 1
          }
          $service | Format-List State, ProcessId, ExitCode, ServiceSpecificExitCode
          if ("$($service.ProcessId)" -eq $before) { throw 'the service did not start again' }
          if (& $userAce $config) { throw "the entry of the administrator stays on $config" }
          bash scripts/install-smoke.sh connected $since 120
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
          $events = Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start} -ErrorAction SilentlyContinue
          $restart = $events | Where-Object { $_.Message -match 'starts again and checks its folders' } | Select-Object -First 1
          if (-not $restart) { throw 'the ResticHub log holds no restart for the exposure' }
          Write-Host "event: $($restart.Message)"
          $warning = $events | Where-Object { $_.Message -match 'removed the access of' -and $_.Message -match 'identity was exposed' } | Select-Object -First 1
          if (-not $warning) { throw "the ResticHub log holds no warning for $config" }
          Write-Host "event: $($warning.Message)"
          # One restart, not a loop.
          Start-Sleep -Seconds 10
          $after = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
          if ($after.State -ne 'Running' -or $after.ProcessId -ne $service.ProcessId) { throw "the service did not stay running: $($after.State), process $($after.ProcessId)" }
      # The checks run before the removal, so a refusal keeps the entry for each later start.
      - name: A planted file keeps the Explorer access of an administrator and the refusal (ADR-0048)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $data = Join-Path $env:ProgramData 'ResticHub'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $planted = Join-Path $data 'planted.txt'
          Set-Content $planted 'x'
          try {
            icacls $data /grant "*${user}:(OI)(CI)(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $data exit code $LASTEXITCODE" }
            foreach ($attempt in 'first', 'second') {
              $start = [DateTime]::Now
              Start-Sleep -Seconds 1
              Restart-Service restichub-agent -ErrorAction SilentlyContinue
              $refused = $null
              for ($i = 0; $i -lt 60 -and -not $refused; $i++) {
                Start-Sleep -Seconds 1
                $refused = Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start} -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -match 'planted\.txt' } | Select-Object -First 1
              }
              if (-not $refused) { throw "the $attempt start wrote no refusal for $planted" }
              Write-Host "event: $($refused.Message)"
              $service = $null
              for ($i = 0; $i -lt 30; $i++) {
                $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
                if ($service.State -eq 'Stopped') { break }
                Start-Sleep -Seconds 1
              }
              $service | Format-List State, ExitCode, ServiceSpecificExitCode
              if ($service.ServiceSpecificExitCode -ne 78) { throw "the $attempt start exit code is $($service.ServiceSpecificExitCode), not 78" }
              $entry = (Get-Acl $data).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
                Where-Object { $_.IdentityReference.Value -eq $user }
              if (-not $entry) { throw "the $attempt start removed the entry, so the next start would not refuse" }
            }
          } finally {
            Remove-Item $planted -Force -ErrorAction SilentlyContinue
            icacls $data /remove:g "*$user" 2>$null | Out-Null
            $global:LASTEXITCODE = 0
          }
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Start-Service restichub-agent
          bash scripts/install-smoke.sh connected $since 60
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
      # An entry of an account that is not an administrator stays a refusal: install-service repairs it.
      - name: The Explorer access of another account stops the service until install-service (ADR-0048)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tree = Join-Path $env:ProgramFiles 'ResticHub'
          $installed = Join-Path $tree 'Agent\restichub-agent.exe'
          # The command cannot replace the directory that holds its own running image.
          $package = Join-Path $env:RUNNER_TEMP 'acl-selfheal-package'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item $installed $package
          $agent = Join-Path $package 'restichub-agent.exe'
          $name = 'rh-smoke-user'
          $password = ConvertTo-SecureString ('Rh-' + [guid]::NewGuid().ToString() + 'aA1!') -AsPlainText -Force
          $account = "${env:COMPUTERNAME}\$name"
          New-LocalUser $name -Password $password | Out-Null
          try {
            $sid = (Get-LocalUser $name).SID.Value
            icacls $tree /grant "${account}:(OI)(CI)(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $tree exit code $LASTEXITCODE" }
            $start = [DateTime]::Now
            Restart-Service restichub-agent -ErrorAction SilentlyContinue
            $service = $null
            for ($i = 0; $i -lt 60; $i++) {
              $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
              if ($service.State -eq 'Stopped' -and $service.ServiceSpecificExitCode -eq 78) { break }
              Start-Sleep -Seconds 1
            }
            $service | Format-List State, ExitCode, ServiceSpecificExitCode
            if ($service.ServiceSpecificExitCode -ne 78) { throw "the service exit code is $($service.ServiceSpecificExitCode), not 78" }
            $refused = Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'another account could change the agent program' } | Select-Object -First 1
            if (-not $refused) { throw 'the service wrote no refusal to the ResticHub log' }
            Write-Host "event: $($refused.Message)"
            $entry = (Get-Acl $tree).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
              Where-Object { $_.IdentityReference.Value -eq $sid }
            if (-not $entry) { throw 'the heal removed the entry of an account that is not an administrator' }
            $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $output = & $agent install-service 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            if ($code -ne 0) { throw "install-service exit code $code" }
            if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
            bash scripts/install-smoke.sh connected $since 60
            if ($LASTEXITCODE -ne 0) { throw 'not connected' }
            $entry = (Get-Acl $tree).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
              Where-Object { $_.IdentityReference.Value -eq $sid }
            if ($entry) { throw 'the repaired program tree keeps the entry of the account' }
          } finally {
            icacls $tree /remove:g $account 2>$null | Out-Null
            Remove-LocalUser $name -ErrorAction SilentlyContinue
            $global:LASTEXITCODE = 0
          }
      - name: An upgrade repairs the access of an older agent build (T20)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:ProgramData 'ResticHub'
          $agent = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          $identity = Join-Path $root 'Agent\identity.json'
          $restore = Join-Path $root 'Restore'
          # An older build left the level with the inherited access of ProgramData and an entry for
          # users, and the old restore root beside the identity.
          New-Item -ItemType Directory -Force $restore | Out-Null
          Set-Content (Join-Path $restore 'restored.txt') 'data'
          icacls $root /inheritance:e | Out-Null
          icacls $root /grant '*S-1-5-32-545:(OI)(CI)(WD)' | Out-Null
          $users = { param($path) (Get-Acl $path).Access | Where-Object { $_.IdentityReference -match 'Users' -and $_.FileSystemRights -match 'Write|Append|CreateFiles' } }
          if (-not (& $users $root)) { throw 'the test did not loosen the access' }
          $restoredBefore = (Get-Acl (Join-Path $restore 'restored.txt')).Sddl
          $planted = Join-Path $root 'planted.txt'
          Set-Content $planted 'x'
          $install = { $script:output = & $agent install-service 2>&1 | Out-String; $script:code = $LASTEXITCODE; Write-Host $script:output }
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          & $install
          if ($code -eq 0) { throw 'an unknown file must stop the repair' }
          if ($output -notmatch 'planted\.txt') { throw 'the message does not name the file' }
          if ($output -notmatch 'repaired the access control of') { throw 'the repair printed no line' }
          if (& $users $root) { throw 'the level must be protected before the refusal' }
          if (-not (Get-Acl $root).AreAccessRulesProtected) { throw 'the level is not protected' }
          Remove-Item $planted
          # A known name that another account owns.
          $roots = Join-Path $root 'Agent-restore-roots.txt'
          Set-Content $roots 'C:\restore'
          icacls $roots /setowner "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          & $install
          if ($code -eq 0) { throw 'a known file of another owner must stop the repair' }
          if ($output -notmatch 'Agent-restore-roots\.txt') { throw 'the message does not name the file' }
          Remove-Item $roots
          # A hard link that gives a known name the content of another file.
          $mode = Join-Path $root 'Agent-server-scripts'
          $other = Join-Path $env:ProgramData 'restichub-smoke-other.ini'
          Set-Content $other 'server_scripts = enabled'
          New-Item -ItemType HardLink -Path $mode -Target $other | Out-Null
          & $install
          if ($code -eq 0) { throw 'a hard link must stop the repair' }
          if ($output -notmatch 'hard link') { throw 'the message does not name the hard link' }
          Remove-Item $mode
          Remove-Item $other
          # Settings that users could change are not trusted after the repair.
          Set-Content $mode 'server_scripts = enabled'
          Set-Content $roots 'C:\restore'
          icacls $mode /grant '*S-1-5-32-545:(R,W)' | Out-Null
          icacls $roots /grant '*S-1-5-32-545:(R,W)' | Out-Null
          & $install
          if ($code -ne 0) { throw "install-service exit code $code" }
          if ($output -notmatch 'trust-server-scripts --enable') { throw 'the removal of the mode file printed no advice' }
          if (Test-Path $mode) { throw 'the writable mode file stays' }
          if (Test-Path $roots) { throw 'the writable restore roots file stays' }
          if (-not (Get-ChildItem $root -Filter 'Agent-restore-roots.txt.untrusted-*')) { throw 'the restore roots file is not set aside' }
          Get-ChildItem $root -Filter 'Agent-restore-roots.txt.untrusted-*' | Remove-Item
          if (& $users $root) { throw 'the access of the level stays loose' }
          if (-not (Test-Path $identity)) { throw 'the identity is gone' }
          if ((Get-Acl (Join-Path $restore 'restored.txt')).Sddl -ne $restoredBefore) { throw 'the old restore root changed' }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
          Remove-Item $restore -Recurse -Force
      # The service writes its full log to the files in ProgramData\ResticHub\Agent-logs and each
      # warning and error to the ResticHub log with the source "ResticHub Agent". The service
      # control manager writes the state changes of the service to the System log.
      - name: The Event Log and the log files hold no canary after ten jobs (AC-AG-03)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $start = [DateTime]::UtcNow.AddSeconds(-2)
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          # A line that is not an absolute path makes the service warn at its start, so the
          # ResticHub log gets an event of the agent.
          $roots = Join-Path $env:ProgramData 'ResticHub\Agent-restore-roots.txt'
          Set-Content $roots 'relative-restore-root'
          icacls $roots /setowner '*S-1-5-32-544' | Out-Null
          Restart-Service restichub-agent
          bash scripts/install-smoke.sh connected $since 60
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
          $canaries = Join-Path $env:SMOKE_DIR 'canaries'
          $values = 1..3 | ForEach-Object { "CANARY-$([guid]::NewGuid())" }
          [IO.File]::WriteAllText($canaries, ($values -join "`n") + "`n")
          bash scripts/install-smoke.sh canary-jobs $canaries "$env:SMOKE_DIR/canary"
          if ($LASTEXITCODE -ne 0) { throw 'the canary jobs failed' }
          $control = "CANARY-$([guid]::NewGuid())"
          eventcreate /L APPLICATION /T INFORMATION /SO RestichubCanaryControl /ID 100 /D "control $control" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'cannot write the control event' }
          $query = "*[System[TimeCreated[@SystemTime>='$($start.ToString('yyyy-MM-ddTHH:mm:ss.fffZ'))']]]"
          $dump = Join-Path $env:SMOKE_DIR 'eventlog.xml'
          $text = foreach ($log in 'Application', 'System', 'ResticHub') {
            wevtutil qe $log "/q:$query" /f:RenderedXml
            if ($LASTEXITCODE -ne 0) { throw "cannot read the $log log" }
          }
          $text | Set-Content -Encoding utf8 $dump
          Write-Host '--- the events of the service in the scanned window'
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=$start.ToLocalTime()} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'ResticHub Agent' } | Format-Table -AutoSize TimeCreated, Id, ProviderName, Message
          if (-not (Select-String -Path $dump -Pattern 'ResticHub Agent' -Quiet)) { throw 'the dump holds no event of the service' }
          Write-Host '--- the ResticHub log'
          $config = wevtutil gl ResticHub
          $config | Write-Host
          $access = ($config | Select-String -Pattern '^channelAccess:\s*(.+)$').Matches.Groups[1].Value
          $expected = 'O:BAG:SYD:(A;;0xf0007;;;SY)(A;;0x7;;;BA)(A;;0x1;;;S-1-5-32-573)'
          if ($access -ne $expected) { throw "the ResticHub log grants another access: '$access'" }
          Write-Host '--- the events of the agent in the scanned window'
          $events = @(Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start.ToLocalTime()} -ErrorAction SilentlyContinue)
          $events | Format-Table -AutoSize -Wrap TimeCreated, Id, LevelDisplayName, Message
          if (-not ($events | Where-Object { $_.LevelDisplayName -eq 'Warning' -and $_.Message -match 'not plain absolute paths' })) {
            throw 'the ResticHub log holds no readable warning of the agent'
          }
          # Get-WinEvent refuses a provider of another log, so wevtutil searches the Application log.
          $stray = wevtutil qe Application "/q:*[System[Provider[@Name='ResticHub Agent']]]" /c:1
          if ($LASTEXITCODE -ne 0) { throw 'cannot read the Application log' }
          if ($stray) { throw "an event of the agent is in the Application log: $stray" }
          $logs = Join-Path $env:ProgramData 'ResticHub\Agent-logs'
          $files = @(Get-ChildItem $logs -Filter 'agent-*.log')
          $files | Format-Table -AutoSize Name, Length
          if (-not $files) { throw 'the service wrote no log file' }
          if (-not ($files | Select-String -Pattern 'the control plane greeted the agent' -Quiet)) { throw 'the log files hold no line of the service' }
          if (Test-Path (Join-Path $env:ProgramData 'ResticHub\Agent\logs')) { throw 'the log is in the identity directory' }
          $acl = Get-Acl $logs
          Write-Host "logs directory: $($acl.Sddl)"
          $foreign = $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
            Where-Object { $_.IdentityReference.Value -notin 'S-1-5-18', 'S-1-5-32-544' }
          if (-not $acl.AreAccessRulesProtected -or $foreign) { throw "the logs directory is not for SYSTEM and Administrators only: $($acl.Sddl)" }
          foreach ($file in $files) {
            $acl = Get-Acl $file.FullName
            Write-Host "$($file.Name): $($acl.Sddl)"
            $foreign = $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
              Where-Object { $_.IdentityReference.Value -notin 'S-1-5-18', 'S-1-5-32-544' }
            if ($foreign) { throw "the log file $($file.Name) is not for SYSTEM and Administrators only: $($acl.Sddl)" }
          }
          & target/debug/restichub-canary-scan.exe --canary $control --file $dump | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "the scan must find the control event (exit $LASTEXITCODE)" }
          & target/debug/restichub-canary-scan.exe --canary-file $canaries --file $dump --dir $logs
          if ($LASTEXITCODE -ne 0) { throw "the canary is in the Event Log or in the log files (exit $LASTEXITCODE)" }
          Remove-Item $roots
      # The service holds its log file open, and a new registration renames the identity directory.
      - name: A new registration works while the service runs and keeps the log files (FR-AG-04)
        shell: pwsh
        run: |
          $agent = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          $logs = Join-Path $env:ProgramData 'ResticHub\Agent-logs'
          $before = @(Get-ChildItem $logs -Filter 'agent-*.log' | Sort-Object Name)
          if (-not $before) { throw 'no log file before the registration' }
          $greetings = @($before | Select-String -Pattern 'the control plane greeted the agent').Count
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          $token = "$env:SMOKE_DIR/enrollment-token-2"
          bash scripts/install-smoke.sh token $token
          if ($LASTEXITCODE -ne 0) { throw 'cannot create the token' }
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          & $agent register --force --url 'https://localhost:8443' --token-file $token --ca-file "$env:SMOKE_DIR/ca.pem"
          if ($LASTEXITCODE -ne 0) { throw "register --force exit code $LASTEXITCODE" }
          foreach ($file in $before) {
            if (-not (Test-Path $file.FullName)) { throw "the registration removed $($file.Name)" }
          }
          if (Test-Path (Join-Path $env:ProgramData 'ResticHub\Agent.old')) { throw 'the old identity stays' }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
          $after = @(Get-ChildItem $logs -Filter 'agent-*.log' | Select-String -Pattern 'the control plane greeted the agent').Count
          if ($after -le $greetings) { throw 'the service wrote no new line after the registration' }
      # A folder that a person made by hand, or an older build, lets the account of the
      # administrator change the agent without elevation (T20).
      - name: register --force repairs an install that the account of the administrator could change (T20)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $installed = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          $program = Join-Path $env:ProgramFiles 'ResticHub'
          # The commands run from the package, as the upgrade guide says: the agent cannot move the
          # directory that holds its own running image.
          $package = Join-Path $env:RUNNER_TEMP 'acl-package'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item $installed $package
          $agent = Join-Path $package 'restichub-agent.exe'
          $data = Join-Path $env:ProgramData 'ResticHub\Agent'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $userAce = { param($path) (Get-Acl $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { $_.IdentityReference.Value -eq $user } }
          # Many cache files, as a restic cache of a real repository holds.
          $blobs = Join-Path $data 'cache\smoke\data'
          New-Item -ItemType Directory -Force $blobs | Out-Null
          1..200 | ForEach-Object { Set-Content (Join-Path $blobs "blob-$_") 'x' }
          # /T puts the entry on each existing item, as the inherited entries of an older build.
          icacls $program /grant "*${user}:(OI)(CI)(M)" /T
          if ($LASTEXITCODE -ne 0) { throw "icacls $program exit code $LASTEXITCODE" }
          icacls $data /grant "*${user}:(OI)(CI)(M)" /T /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls $data exit code $LASTEXITCODE" }
          # A file takes no inheritance flags, and its protected DACL takes no inherited entry.
          icacls $installed /grant "*${user}:(M)"
          if ($LASTEXITCODE -ne 0) { throw "icacls $installed exit code $LASTEXITCODE" }
          Write-Host "the entry of the user on the agent before the repair:"
          & $userAce $installed | Format-List IdentityReference, FileSystemRights, AccessControlType, IsInherited | Out-String | Write-Host
          if (-not (& $userAce $program) -or -not (& $userAce $data) -or -not (& $userAce $installed)) { throw 'the test did not loosen the access' }
          $identity = Join-Path $data 'identity.json'
          $before = Get-FileHash $identity
          # install-service makes the program directory again, prints summaries and refuses the identity.
          $output = & $agent install-service 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) { throw 'install-service must refuse the identity' }
          if ($output -notmatch 'could be changed by another account') { throw 'no refusal of the identity' }
          if ($output -notmatch 'repaired the access control of \d+ entr(y|ies) under') { throw 'no summary line' }
          $lines = @($output -split "`n" | Where-Object { $_ -match 'repaired the access control of' })
          if ($lines.Count -gt 4) { throw "the repair printed $($lines.Count) lines instead of one for each directory" }
          $agentDir = [regex]::Escape($data)
          if ($output -notmatch "repaired the access control of (\d+) entries under $agentDir\r?\n") { throw 'no summary for the data directory' }
          if ([int]$Matches[1] -lt 200) { throw "the summary counts $($Matches[1]) entries, not the cache files" }
          if ($output -notmatch 'downloads and verifies restic again') { throw 'restic in the open directory was not removed' }
          if ($output -notmatch "moved $([regex]::Escape($program)) to $([regex]::Escape($program))\.untrusted-\d+") { throw 'the open program directory was not moved aside' }
          if (& $userAce $program) { throw 'the program directory stays open' }
          if (-not (Test-Path $installed)) { throw 'the agent was not copied into the new program directory' }
          Write-Host "the access control of the agent after the repair:"
          icacls $installed
          if (& $userAce $installed) { throw 'the agent executable stays open' }
          if (Test-Path (Join-Path $program 'Agent\restic.exe')) { throw 'restic of the open directory stays' }
          if ((Get-FileHash $identity).Hash -ne $before.Hash) { throw 'install-service changed the identity' }
          # The service refuses the identity and does not restart forever. An entry of the
          # administrator on a directory is repaired at the start (ADR-0048, ADR-0049), so the
          # refusal comes from an entry on a file, which the agent never repairs.
          icacls (Join-Path $data 'agent-key.pem') /grant "*${user}:(M)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls the key exit code $LASTEXITCODE" }
          & $agent status 2>&1 | Out-String | Tee-Object -Variable status | Write-Host
          if ($status -notmatch 'does not use the identity') { throw 'status does not report the refusal' }
          $start = [DateTime]::Now
          Start-Service restichub-agent -ErrorAction SilentlyContinue
          $refused = $null
          for ($i = 0; $i -lt 60 -and -not $refused; $i++) {
            Start-Sleep -Seconds 1
            $refused = Get-WinEvent -FilterHashtable @{LogName='ResticHub'; ProviderName='ResticHub Agent'; StartTime=$start} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'does not use the identity|identity of this host could be changed' } | Select-Object -First 1
          }
          if (-not $refused) { throw 'the service wrote no refusal to the event log' }
          Write-Host "event: $($refused.Message)"
          $service = $null
          for ($i = 0; $i -lt 30; $i++) {
            $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
            if ($service.State -eq 'Stopped' -and $service.ServiceSpecificExitCode -eq 78) { break }
            Start-Sleep -Seconds 1
          }
          $service | Format-List State, ExitCode, ServiceSpecificExitCode
          if ($service.ServiceSpecificExitCode -ne 78) { throw "the service exit code is $($service.ServiceSpecificExitCode)" }
          # register --force repairs everything first, then replaces the identity.
          $token = "$env:SMOKE_DIR/enrollment-token-3"
          bash scripts/install-smoke.sh token $token
          if ($LASTEXITCODE -ne 0) { throw 'cannot create the token' }
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $output = & $agent register --force --url 'https://localhost:8443' --token-file $token --ca-file "$env:SMOKE_DIR/ca.pem" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { throw "register --force exit code $code" }
          if (& $userAce $data) { throw 'the identity directory stays open' }
          if (-not (Test-Path $identity)) { throw 'no new identity' }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'ResticHub\Agent\restic.exe'))) { throw 'restic was not installed again' }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
          if ($LASTEXITCODE -ne 0) { throw 'not connected' }
          bash scripts/install-smoke.sh one-job "$env:SMOKE_DIR/acl-repair"
          if ($LASTEXITCODE -ne 0) { throw 'the job after the repair failed' }
      # The same rule as Restart=on-failure with RestartPreventExitStatus=78 on Linux.
      - name: the service restarts after each crash (FR-AG-01)
        shell: pwsh
        run: |
          foreach ($crash in 1..3) {
            $before = (Get-CimInstance Win32_Service -Filter "Name='restichub-agent'").ProcessId
            if (-not $before) { throw "crash ${crash}: the service has no process" }
            Stop-Process -Id $before -Force
            $service = $null
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
              if ($service.State -eq 'Running' -and $service.ProcessId -and $service.ProcessId -ne $before) { break }
            }
            Write-Host "crash ${crash}: state $($service.State), process $before -> $($service.ProcessId) after $i s"
            if ($service.State -ne 'Running' -or $service.ProcessId -eq $before) { throw "the service did not restart after crash $crash" }
          }
      - name: uninstall-service removes the service and the event source and keeps the log (FR-IN-08)
        shell: pwsh
        run: |
          $agent = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          $source = 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\ResticHub\ResticHub Agent'
          if (-not (Test-Path $source)) { throw 'the event source is not registered' }
          & $agent uninstall-service
          if ($LASTEXITCODE -ne 0) { throw "uninstall-service exit code $LASTEXITCODE" }
          if (Get-Service restichub-agent -ErrorAction SilentlyContinue) { throw 'the service stays' }
          if (Test-Path $source) { throw 'the event source stays' }
          if (-not (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\ResticHub')) { throw 'the ResticHub log is gone' }
          if (-not (Get-WinEvent -LogName ResticHub -MaxEvents 1 -ErrorAction SilentlyContinue)) { throw 'the events are gone' }
          if (-not (Get-ChildItem (Join-Path $env:ProgramData 'ResticHub\Agent-logs') -Filter 'agent-*.log')) { throw 'the log files are gone' }
          & $agent uninstall-service
          if ($LASTEXITCODE -ne 0) { throw "a second uninstall-service exit code $LASTEXITCODE" }
      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Service restichub-agent -ErrorAction SilentlyContinue | Format-List *
          wevtutil gl ResticHub
          Get-WinEvent -LogName ResticHub -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
          Get-ChildItem (Join-Path $env:ProgramData 'ResticHub\Agent-logs') -Filter 'agent-*.log' -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1 | Get-Content -Tail 80
          Write-Host '--- control plane log'
          bash scripts/install-smoke.sh cp-logs

  # The path of a real host: an old agent copied by hand into Program Files, its data directory
  # open to Users, and a process that keeps a file of the old copy open. The new package from a
  # download folder must end with a working host without a manual repair (T20, FR-IN-07).
  windows-manual-copy:
    name: Install smoke (AC-IN-03) / Windows manual copy of an old agent (T20)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OLD_AGENT_TAG: v0.1.0-rc.4
    steps:
      - uses: actions/checkout@v7
      - name: Set the state directory
        run: echo "SMOKE_DIR=$(cygpath -m "$RUNNER_TEMP")/smoke" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # The old agent comes from its source tag: the published Windows package of that release does
      # not start. The build shares the target directory, so it reuses the dependencies.
      - name: Build the old agent
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "refs/tags/$OLD_AGENT_TAG:refs/tags/$OLD_AGENT_TAG"
          git worktree add "$RUNNER_TEMP/old-src" "$OLD_AGENT_TAG"
          cargo build -p restichub-agent --manifest-path "$RUNNER_TEMP/old-src/Cargo.toml" --target-dir target
          mkdir -p "$RUNNER_TEMP/old-package"
          cp target/debug/restichub-agent.exe "$RUNNER_TEMP/old-package/restichub-agent.exe"
          "$RUNNER_TEMP/old-package/restichub-agent.exe" --version
      - name: Build the control plane and the new agent
        run: cargo build -p restichub-cp -p restichub-agent
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          pg_bin="$(ls -d "/c/Program Files/PostgreSQL/"*/bin | sort -V | tail -n1)"
          echo "$pg_bin" >> "$GITHUB_PATH"
          export PATH="$pg_bin:$PATH"
          pg_data="$(cygpath -w "$RUNNER_TEMP/pgdata")"
          initdb -D "$pg_data" -U restichub -A trust -E UTF8
          pg_ctl -D "$pg_data" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -c listen_addresses=127.0.0.1" -w start
          createdb -h 127.0.0.1 -U restichub restichub
      - name: Prepare the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: restichub
          CP_BIN: target/debug/restichub-cp.exe
        run: scripts/install-smoke.sh db-prepare
      - name: Start the control plane and create the token
        env:
          CP_BIN: target/debug/restichub-cp.exe
          SMOKE_KEK: /wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          scripts/install-smoke.sh cp-up
          OPENSSL="$(cygpath -u "$PROGRAMFILES")/Git/usr/bin/openssl.exe" scripts/install-smoke.sh ca
      - name: (1, 2) The old agent registers, then the copy and the data directory are left open
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $old = Join-Path $env:RUNNER_TEMP 'old-package\restichub-agent.exe'
          Set-Location (Split-Path $old)
          Write-Host "--- old agent: register"
          $output = & $old register --url 'https://localhost:8443' --token-file "$env:SMOKE_DIR/enrollment-token" --ca-file "$env:SMOKE_DIR/ca.pem" 2>&1 | Out-String
          Write-Host $output
          Write-Host "exit code $LASTEXITCODE"
          $tree = Join-Path $env:ProgramFiles 'ResticHub'
          $agentDir = Join-Path $tree 'Agent'
          $data = Join-Path $env:ProgramData 'ResticHub'
          if (-not (Test-Path (Join-Path $data 'Agent\identity.json'))) { throw 'the old agent wrote no identity' }
          if (-not (Test-Path (Join-Path $agentDir 'restichub-agent.exe'))) { throw 'the old agent is not in Program Files' }
          Get-CimInstance Win32_Service -Filter "Name='restichub-agent'" | Format-List Name, State, StartMode, PathName
          # A manual copy of the unpacked package: the agent, the license texts and the hashes, with
          # the access that Program Files gives to a new folder, and the account of the
          # administrator with Modify, as a client edition gives through CREATOR OWNER.
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $agentDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'packaging\THIRD_PARTY_NOTICES') $agentDir
          # The downloaded archive, left beside the copy.
          Set-Content (Join-Path $agentDir 'restichub-agent-old-windows-amd64.zip') 'zip'
          Get-ChildItem $agentDir -File | Get-FileHash | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content (Join-Path $agentDir 'SHA256SUMS')
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $tree /reset /T /Q
          if ($LASTEXITCODE -ne 0) { throw "icacls /reset exit code $LASTEXITCODE" }
          icacls $tree /grant "*${user}:(OI)(CI)(M)" /T /Q
          if ($LASTEXITCODE -ne 0) { throw "icacls /grant exit code $LASTEXITCODE" }
          icacls (Join-Path $agentDir 'restichub-agent.exe') /grant "*${user}:(M)"
          if ($LASTEXITCODE -ne 0) { throw "icacls exe exit code $LASTEXITCODE" }
          # An older build left the data directory open: Users may create files and folders.
          icacls $data /grant '*S-1-5-32-545:(OI)(CI)(WD,AD)' /T /Q
          if ($LASTEXITCODE -ne 0) { throw "icacls data exit code $LASTEXITCODE" }
          Write-Host "--- the access before the new package runs"
          icacls $tree
          icacls $agentDir
          icacls (Join-Path $agentDir 'restichub-agent.exe')
          icacls (Join-Path $data 'Agent')
          Get-ChildItem -Recurse $tree | Format-Table -AutoSize FullName, Length
      - name: (3-6) The new package from a download folder ends with a working host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tree = Join-Path $env:ProgramFiles 'ResticHub'
          $agentDir = Join-Path $tree 'Agent'
          $installed = Join-Path $agentDir 'restichub-agent.exe'
          $config = Join-Path $env:ProgramData 'ResticHub\Agent'
          $marker = 'HKLM:\SOFTWARE\ResticHub\Agent'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $userAce = { param($path) (Get-Acl $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { $_.IdentityReference.Value -eq $user } }
          $service = { Get-CimInstance Win32_Service -Filter "Name='restichub-agent'" }
          $failures = [Collections.Generic.List[string]]::new()
          $expect = { param($ok, $what) if ($ok) { Write-Host "ok: $what" } else { Write-Host "FAILED: $what"; $failures.Add($what) } }
          $run = {
            param($title, [string[]]$arguments, $stdin)
            Write-Host "=== $title"
            Write-Host "> restichub-agent.exe $($arguments -join ' ')"
            if ($stdin) { $text = $stdin | & .\restichub-agent.exe @arguments 2>&1 | Out-String }
            else { $text = & .\restichub-agent.exe @arguments 2>&1 | Out-String }
            $code = $LASTEXITCODE
            Write-Host $text
            Write-Host "exit code $code"
            return @{ Text = $text; Code = $code }
          }
          $package = Join-Path $env:USERPROFILE 'Downloads\restichub-agent-new'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'target\debug\restichub-agent.exe') $package
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $package
          Set-Location $package

          Write-Host "=== (3) another process keeps a file of the old copy open without FileShare.Delete"
          $license = Join-Path $agentDir 'LICENSE'
          $ready = Join-Path $env:RUNNER_TEMP 'holder.ready'
          $holder = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "`$f = [IO.File]::Open('$license', 'Open', 'Read', 'Read'); Set-Content '$ready' 'open'; Start-Sleep -Seconds 3600"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $ready); $i++) { Start-Sleep -Seconds 1 }
          & $expect (Test-Path $ready) "the holder (PID $($holder.Id)) keeps $license open"

          $before = & $service
          Write-Host "the old service: $($before.State), $($before.StartMode)"
          $first = & $run '(4) install-service' @('install-service')
          $text = $first.Text
          & $expect ($first.Code -ne 0) 'install-service refuses the identity of the old agent'
          & $expect ($text -match 'repaired the access control of \d+ entr(y|ies) under') 'the repair of ProgramData prints summary lines'
          & $expect ($text -match 'repairs it in place') 'the held tree is repaired in place'
          & $expect ($text -match 'removed .*restichub-agent-old-windows-amd64\.zip') 'the file that the agent does not know is removed'
          & $expect ($text -match "warning: a process kept .*\(PID $($holder.Id)\).*starts only by hand") 'the warning names the holder and the manual start'
          & $expect ($text -match 'could be changed by another account') 'the identity is refused'
          & $expect ($text -match 'register --force') 'the next step is named'
          & $expect ($text -notmatch 'is not intact|restic update|icacls|does not know') 'no other refusal and no manual repair'
          & $expect ($text.IndexOf('warning: a process kept') -ge 0 -and $text.IndexOf('warning: a process kept') -lt $text.IndexOf('could be changed by another account')) 'the warning comes before the refusal'
          $state = & $service
          & $expect ($state.StartMode -eq 'Manual') "the service starts by hand (start mode $($state.StartMode), state $($state.State))"
          & $expect ($null -ne (Get-ItemProperty $marker -ErrorAction SilentlyContinue).ProgramRepairedInPlaceAt) 'the record of the repair in place exists'
          & $expect ((Test-Path $installed) -and -not (& $userAce $installed)) 'the new agent is in place and protected'
          & $expect (-not (& $userAce $tree) -and -not (& $userAce $agentDir) -and -not (& $userAce $license)) 'each level and the held file are protected'
          & $expect ((Get-Acl $installed).Owner -match 'Administrators') "the owner of the agent is $((Get-Acl $installed).Owner)"

          $token = "$env:SMOKE_DIR/enrollment-token-mindcore"
          Push-Location $env:GITHUB_WORKSPACE; bash scripts/install-smoke.sh token $token; Pop-Location
          $planted = Join-Path $agentDir 'version.dll'
          Set-Content $planted 'x'
          # An administrator owns it, so only the check before the start can refuse it.
          icacls $planted /setowner '*S-1-5-32-544' | Out-Null
          $refused = & $run '(4) register --force with a file that the agent does not know' @('register', '--force', '--url', 'https://localhost:8443', '--token-stdin', '--ca-file', "$env:SMOKE_DIR/ca.pem") (Get-Content $token)
          & $expect ($refused.Code -ne 0 -and $refused.Text -match 'version\.dll') 'register refuses the planted file and names it'
          & $expect (Test-Path (Join-Path $config 'identity.json')) 'the refusal keeps the old identity'
          Remove-Item $planted
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $registered = & $run '(4) register --force with the same token' @('register', '--force', '--url', 'https://localhost:8443', '--token-stdin', '--ca-file', "$env:SMOKE_DIR/ca.pem") (Get-Content $token)
          & $expect ($registered.Code -eq 0) 'register --force succeeds, so the refused run did not spend the token'
          & $expect ($registered.Text -match 'waits for a restart|starts only by hand') 'register repeats the warning'

          Write-Host "=== (5) the host works"
          $state = & $service
          $state | Format-List Name, State, StartMode, StartName, PathName
          & $expect ($state.State -eq 'Running') 'the service runs'
          & $expect ($state.StartMode -eq 'Manual') 'the service still starts by hand'
          Push-Location $env:GITHUB_WORKSPACE
          bash scripts/install-smoke.sh connected $since 60
          & $expect ($LASTEXITCODE -eq 0) 'the agent is connected'
          $source = [IO.Path]::GetFullPath((Join-Path $env:SMOKE_DIR 'mindcore-source'))
          New-Item -ItemType Directory -Force $source | Out-Null
          Set-Content (Join-Path $source 'file.txt') 'backup after the repair'
          bash scripts/install-smoke.sh backup "$env:SMOKE_DIR/mindcore" $source windows
          & $expect ($LASTEXITCODE -eq 0) 'a backup job succeeded'
          Pop-Location
          $restic = Join-Path $agentDir 'restic.exe'
          $record = Get-Content (Join-Path $config 'restic.json') -ErrorAction SilentlyContinue | ConvertFrom-Json
          & $expect ((Test-Path $restic) -and $record -and (Get-FileHash $restic -Algorithm SHA256).Hash -eq $record.sha256.ToUpper()) "restic.exe matches its record ($($record.version))"
          & $installed status 2>&1 | Out-String | Write-Host

          Write-Host "=== (6) the holder ends, but the computer did not restart"
          Stop-Process -Id $holder.Id
          $holder.WaitForExit()
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $same = & $run '(6) install-service before the restart' @('install-service')
          & $expect ($same.Code -eq 0) 'install-service succeeds'
          & $expect ($same.Text -notmatch '(?m)^(repaired|moved) ') 'it repairs nothing'
          & $expect ($same.Text -match 'waits for a restart') 'it still waits for the restart'
          & $expect ((& $service).StartMode -eq 'Manual') 'the service still starts by hand'
          Write-Host "=== (6) restart simulation: the record says that the repair was before the last boot"
          Set-ItemProperty $marker -Name ProgramRepairedInPlaceAt -Value 1 -Type QWord
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $after = & $run '(6) install-service after the restart' @('install-service')
          & $expect ($after.Code -eq 0) 'install-service succeeds'
          & $expect ($after.Text -notmatch '(?m)^(repaired|moved) ') 'it prints no repaired or moved line'
          & $expect ($after.Text -match 'passed the check after the restart') 'it reports the clean check'
          $state = & $service
          & $expect ($state.StartMode -eq 'Auto' -and $state.State -eq 'Running') "the automatic start is back (start mode $($state.StartMode), state $($state.State))"
          & $expect (-not (Test-Path $marker)) 'the record is removed'
          Push-Location $env:GITHUB_WORKSPACE
          bash scripts/install-smoke.sh connected $since 60
          & $expect ($LASTEXITCODE -eq 0) 'the agent is connected'
          Pop-Location

          if ($failures.Count -gt 0) { throw "failed expectations:`n$($failures -join "`n")" }
      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Service -Filter "Name='restichub-agent'" | Format-List *
          Get-Item 'HKLM:\SOFTWARE\ResticHub\Agent' -ErrorAction SilentlyContinue | Format-List *
          Get-ChildItem -Recurse (Join-Path $env:ProgramFiles 'ResticHub') -ErrorAction SilentlyContinue | Format-Table -AutoSize FullName, Length
          Get-WinEvent -LogName ResticHub -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
          Get-ChildItem (Join-Path $env:ProgramData 'ResticHub\Agent-logs') -Filter 'agent-*.log' -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1 | Get-Content -Tail 80
          Write-Host '--- control plane log'
          bash scripts/install-smoke.sh cp-logs
