name: Install smoke (AC-IN-03)

# Installs the agent as a real operating system service on a runner, enrolls it with a control
# plane that runs on the same runner, and checks that the service starts and connects, also after
# a restart. The reboot part of AC-IN-03 stays a manual check.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/restichub-agent/**
      - crates/restichub-cp/**
      - crates/restichub-proto/**
      - packaging/**
      - scripts/install-smoke.sh
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Install smoke (AC-IN-03) / Linux systemd
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restichub
          POSTGRES_PASSWORD: restichub
          POSTGRES_DB: restichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restichub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set the state directory
        shell: bash
        run: echo "SMOKE_DIR=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/smoke" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the control plane and the agent
        run: cargo build -p restichub-cp -p restichub-agent
      - name: Prepare the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: restichub
          PGPASSWORD: restichub
          CP_BIN: target/debug/restichub-cp
        run: scripts/install-smoke.sh db-prepare
      - name: Start the control plane and create the token
        env:
          CP_BIN: target/debug/restichub-cp
        run: scripts/install-smoke.sh cp-up
      - name: Prepare /opt and the download folder
        run: |
          # The runner image makes /opt world-writable with a default ACL for the runner account.
          # The agent refuses such a location (T20), so the step restores a normal root-owned /opt.
          sudo chmod 0755 /opt
          sudo setfacl -b /opt
          ls -ld /opt
          mkdir -p "$HOME/Downloads"
          cp target/debug/restichub-agent "$HOME/Downloads/restichub-agent"
      - name: Register the agent from the download folder
        run: |
          set -euo pipefail
          scripts/install-smoke.sh ca
          sudo "$HOME/Downloads/restichub-agent" register --url "https://localhost:8443" \
            --token-file "$SMOKE_DIR/enrollment-token" --ca-file "$SMOKE_DIR/ca.pem"
      - name: The agent installed itself into the program directory
        run: |
          set -euo pipefail
          test -x /opt/restichub-agent/bin/restichub-agent
          test -x /opt/restichub-agent/bin/restic
          test "$(stat -c '%U %a' /opt/restichub-agent)" = "root 755"
          grep -q '/opt/restichub-agent/bin/restichub-agent' /etc/systemd/system/restichub-agent.service
          sudo /opt/restichub-agent/bin/restichub-agent status
      - name: The service is enabled, active and connected
        run: |
          set -euo pipefail
          test "$(systemctl is-enabled restichub-agent)" = enabled
          test "$(systemctl is-active restichub-agent)" = active
          scripts/install-smoke.sh connected 0 60
      - name: The service connects again after a restart
        run: |
          set -euo pipefail
          since="$(date -u +%s)"
          sudo systemctl restart restichub-agent
          test "$(systemctl is-active restichub-agent)" = active
          scripts/install-smoke.sh connected "$since" 60
      - name: Diagnostics
        if: failure()
        run: |
          sudo systemctl status restichub-agent --no-pager || true
          sudo journalctl -u restichub-agent --no-pager | tail -50 || true
          echo "--- control plane log"
          scripts/install-smoke.sh cp-logs | tail -80 || true

  windows:
    name: Install smoke (AC-IN-03) / Windows service
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set the state directory
        shell: bash
        run: echo "SMOKE_DIR=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/smoke" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the control plane and the agent
        run: cargo build -p restichub-cp -p restichub-agent
      # The runner holds PostgreSQL but no container engine. A fresh cluster in a temporary
      # directory does not depend on the version or the credentials of the installed one.
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          pg_bin="$(ls -d "/c/Program Files/PostgreSQL/"*/bin | sort -V | tail -n1)"
          echo "$pg_bin" >> "$GITHUB_PATH"
          export PATH="$pg_bin:$PATH"
          pg_data="$(cygpath -w "$RUNNER_TEMP/pgdata")"
          initdb -D "$pg_data" -U restichub -A trust -E UTF8
          pg_ctl -D "$pg_data" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -c listen_addresses=127.0.0.1" -w start
          createdb -h 127.0.0.1 -U restichub restichub
      - name: Prepare the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: restichub
          CP_BIN: target/debug/restichub-cp.exe
        run: scripts/install-smoke.sh db-prepare
      - name: Start the control plane and create the token
        env:
          CP_BIN: target/debug/restichub-cp.exe
        run: scripts/install-smoke.sh cp-up
      - name: Register the agent from a user folder
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL="$(cygpath -u "$PROGRAMFILES")/Git/usr/bin/openssl.exe" scripts/install-smoke.sh ca
          mkdir -p "$USERPROFILE/Downloads"
          cp target/debug/restichub-agent.exe "$USERPROFILE/Downloads/restichub-agent.exe"
          "$USERPROFILE/Downloads/restichub-agent.exe" register --url "https://localhost:8443" \
            --token-file "$(cygpath -w "$SMOKE_DIR/enrollment-token")" \
            --ca-file "$(cygpath -w "$SMOKE_DIR/ca.pem")"
      - name: The agent installed itself under Program Files
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          if (-not (Test-Path "$dir\restichub-agent.exe")) { throw 'agent missing' }
          if (-not (Test-Path "$dir\restic.exe")) { throw 'restic missing' }
          if (Test-Path "$dir\bin") { throw 'the bin directory exists' }
          & "$dir\restichub-agent.exe" status
          if ($LASTEXITCODE -ne 0) { throw "status exit code $LASTEXITCODE" }
      - name: The service is running, automatic, LocalSystem and connected
        shell: pwsh
        run: |
          $service = Get-CimInstance Win32_Service -Filter "Name='restichub-agent'"
          $service | Format-List Name, State, StartMode, StartName
          if ($service.State -ne 'Running') { throw "state: $($service.State)" }
          if ($service.StartMode -ne 'Auto') { throw "start mode: $($service.StartMode)" }
          if ($service.StartName -ne 'LocalSystem') { throw "account: $($service.StartName)" }
          bash scripts/install-smoke.sh connected 0 60
      - name: The service connects again after a restart
        shell: pwsh
        run: |
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Restart-Service restichub-agent
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
      - name: An install with restic in an old location migrates
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          $agent = Join-Path $dir 'restichub-agent.exe'
          $restic = Join-Path $dir 'restic.exe'
          $olds = @(
            (Join-Path $dir 'bin'),
            (Join-Path $env:ProgramData 'ResticHub\Agent\bin')
          )
          foreach ($old in $olds) {
            $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $hash = (Get-FileHash $restic -Algorithm SHA256).Hash
            Stop-Service restichub-agent
            New-Item -ItemType Directory -Force $old | Out-Null
            Move-Item $restic (Join-Path $old 'restic.exe')
            & $agent install-service
            if ($LASTEXITCODE -ne 0) { throw "install-service exit code $LASTEXITCODE" }
            if (-not (Test-Path $restic)) { throw "restic not moved from $old" }
            if ((Get-FileHash $restic -Algorithm SHA256).Hash -ne $hash) { throw 'hash changed by the move' }
            if (Test-Path $old) { throw "$old still exists" }
            if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
            bash scripts/install-smoke.sh connected $since 60
          }
          & $agent status
          if ($LASTEXITCODE -ne 0) { throw "status exit code $LASTEXITCODE" }
      - name: The service moves restic by itself at the start
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'ResticHub\Agent'
          $restic = Join-Path $dir 'restic.exe'
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Stop-Service restichub-agent
          New-Item -ItemType Directory -Force (Join-Path $dir 'bin') | Out-Null
          Move-Item $restic (Join-Path $dir 'bin\restic.exe')
          Start-Service restichub-agent
          # The service reports Running before its start code runs.
          $bin = Join-Path $dir 'bin'
          for ($i = 0; $i -lt 60 -and -not ((Test-Path $restic) -and -not (Test-Path $bin)); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $restic)) {
            Get-Service restichub-agent | Format-List Status
            & (Join-Path $dir 'restichub-agent.exe') status
            throw 'restic not moved by the service'
          }
          if (Test-Path (Join-Path $dir 'bin')) { throw 'the bin directory exists' }
          bash scripts/install-smoke.sh connected $since 60
      - name: A second install-service works while the service runs (FR-IN-08)
        shell: pwsh
        run: |
          $since = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $agent = Join-Path $env:ProgramFiles 'ResticHub\Agent\restichub-agent.exe'
          & $agent install-service
          if ($LASTEXITCODE -ne 0) { throw "install-service exit code $LASTEXITCODE" }
          if ((Get-Service restichub-agent).Status -ne 'Running') { throw 'not running' }
          bash scripts/install-smoke.sh connected $since 60
      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Service restichub-agent -ErrorAction SilentlyContinue | Format-List *
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='restichub-agent'} -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          Write-Host '--- control plane log'
          bash scripts/install-smoke.sh cp-logs
