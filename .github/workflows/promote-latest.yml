name: Promote latest

# Move the `latest` image tag to a published release (AC-NFR-03).
#
# `release.yml` pushes only the version tag of an image. The operator checks the draft
# release and publishes it; then this workflow moves `latest` to the image of that
# release. It moves the tag only for a stable release that has the highest version of
# all published stable releases, so `latest` never goes back (a patch of an older line
# does not take it). The job uses the environment `release-latest`. The environment needs
# the approval of a reviewer and accepts only a `v*` tag as the ref. The job `check` runs
# first without the environment, so a pre-release or a non-stable tag never creates a
# deployment that waits for an approval.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of a published release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

# One group for each tag, so a queued run for another tag never replaces this one. The
# comparison of the versions in the job keeps `latest` from going back.
concurrency:
  group: promote-latest-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cp
  COSIGN_URL: https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64
  COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ "$PRERELEASE" = true ] || ! [[ "$tag" =~ $stable ]]; then
            echo "::notice::$tag is a pre-release or not a stable version; latest stays"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  latest:
    name: Move the latest tag
    needs: check
    if: needs.check.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment: release-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$tag" =~ $stable ]]; then
            echo "::notice::$tag is not a stable version; latest stays"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(gh api "repos/$REPO/releases/tags/$tag" --jq '"\(.draft)/\(.prerelease)"')"
          if [ "$state" != false/false ]; then
            echo "::notice::the release $tag is a draft or a pre-release ($state); latest stays"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E "$stable" | sort -V | tail -n 1)"
          if [ "$highest" != "$tag" ]; then
            echo "::notice::$tag is not the highest stable release ($highest); latest stays"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "move=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Install cosign
        if: steps.pick.outputs.move == 'true'
        run: packaging/install-tool.sh "$COSIGN_URL" "$COSIGN_SHA256" cosign binary
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.pick.outputs.move == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.pick.outputs.move == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag moves only to an image whose signature comes from the release workflow at this tag.
      - name: Verify and move the tag
        if: steps.pick.outputs.move == 'true'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          VERSION: ${{ steps.pick.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign verify \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image@$digest" >/dev/null
          docker buildx imagetools create -t "$image:latest" "$image@$digest"
          echo "latest now points to $image@$digest"
