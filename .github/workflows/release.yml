name: Release

# Build, sign and draft a release for a `v*` tag (AC-NFR-03).
#
# Every artifact and every image gets a keyless cosign signature from the GitHub OIDC
# identity of this workflow, and an SBOM. The release stays a draft: the operator
# publishes it after a manual check. A `workflow_dispatch` run builds and checks
# everything but signs and publishes nothing.
#
# SBOM tools: `cargo-cyclonedx` for the agent packages, because it reads the exact
# dependency graph of the crate from `Cargo.lock` and a scan of a stripped binary
# cannot. `syft` for the images, because it reads the installed packages of the
# image layers, which Cargo metadata does not cover. Both write CycloneDX JSON.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cp
  CARGO_CYCLONEDX_VERSION: 0.5.9

jobs:
  gates:
    name: Dependency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit
        run: |
          for dir in ui docs; do
            ( cd "$dir" && npm ci --ignore-scripts && npm audit --audit-level=high )
          done

  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          crate="$(awk -F'"' '/^name = "restichub-agent"$/{getline; print $2; exit}' Cargo.lock)"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            # The tag is the crate version, optionally with a pre-release suffix.
            case "$version" in
              "$crate"|"$crate"-*) ;;
              *) echo "::error::tag $REF_NAME does not match the crate version $crate"; exit 1 ;;
            esac
          else
            version="$crate-dev"
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  agent:
    name: Agent (${{ matrix.os }}-${{ matrix.arch }})
    needs: [gates, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: restichub-agent
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: restichub-agent
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: restichub-agent.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the agent
        shell: bash
        run: |
          # A musl build links statically, so the binary runs on any Linux distribution.
          RESTICHUB_BUILD_VERSION="$(git rev-parse --short=7 HEAD)" \
            cargo build --release --locked -p restichub-agent --target "${{ matrix.target }}"
      - name: Check the binary
        if: matrix.os == 'linux'
        run: |
          file "target/${{ matrix.target }}/release/restichub-agent"
          if ! ldd "target/${{ matrix.target }}/release/restichub-agent" 2>&1 | grep -q 'not a dynamic'; then
            echo "::error::the Linux agent is not static"
            exit 1
          fi
      - name: Assemble the package
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          BIN: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          out="$RUNNER_TEMP/out"
          rm -rf "$stage" "$out"
          mkdir -p "$stage" "$out"
          cp "$BIN" "$stage/"
          cp LICENSE "$stage/LICENSE"
          cp packaging/THIRD_PARTY_NOTICES "$stage/THIRD_PARTY_NOTICES"
          ( cd "$stage" && sha256sum "${{ matrix.binary }}" LICENSE THIRD_PARTY_NOTICES > SHA256SUMS )
          name="restichub-agent-${VERSION}-${OS}-${ARCH}"
          if [ "$OS" = windows ]; then
            ( cd "$stage" && 7z a -tzip -mx=9 "$out/$name.zip" "${{ matrix.binary }}" LICENSE THIRD_PARTY_NOTICES SHA256SUMS >/dev/null )
            echo "archive=$out/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$out/$name.tar.gz" -C "$stage" "${{ matrix.binary }}" LICENSE THIRD_PARTY_NOTICES SHA256SUMS
            echo "archive=$out/$name.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "name=$name" >> "$GITHUB_ENV"
      # AC-IN-01: the package holds the agent, the licenses and the hashes, and no restic.
      - name: Verify the package (AC-IN-01)
        shell: bash
        run: packaging/verify-agent-package.sh --package "$archive"
      - name: Install cargo-cyclonedx
        shell: bash
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Write the SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/restichub-agent/Cargo.toml \
            --format json --spec-version 1.5 --target "${{ matrix.target }}" \
            --override-filename sbom
          mv crates/restichub-agent/sbom.json "$RUNNER_TEMP/out/$name.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  image:
    name: Image (${{ matrix.platform }})
    needs: [gates, version]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each platform builds on a native runner and pushes by digest. The `manifest` job
      # joins the digests into one tag. The build creates no attestation here: the
      # `manifest` job signs and attests the digests.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.title=ResticHub control plane
            org.opencontainers.image.description=The ResticHub control plane.
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            RESTICHUB_BUILD_VERSION=${{ needs.version.outputs.version }}
          provenance: false
          sbom: false
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    name: Image manifest, signature and SBOM
    needs: [version, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - id: index
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${IMAGE_NAME}"
          tags=(-t "$repo:$VERSION")
          if [ "$PRERELEASE" = false ]; then
            tags+=(-t "$repo:latest")
          fi
          refs=()
          for f in "$RUNNER_TEMP"/digests/*; do refs+=("$repo@$(cat "$f")"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/image-out"
          # Sign the index and each platform image by digest. A tag can move, a digest cannot.
          for ref in "$repo@$digest" "${refs[@]}"; do
            cosign sign --yes "$ref"
          done
          # One SBOM per platform image, attested to its digest and kept as a release file.
          for f in "$RUNNER_TEMP"/digests/*; do
            platform="$(basename "$f")"
            ref="$repo@$(cat "$f")"
            sbom="$RUNNER_TEMP/image-out/restichub-cp-${VERSION}-${platform}.cdx.json"
            syft "$ref" -o "cyclonedx-json@1.5=$sbom"
            cosign attest --yes --type cyclonedx --predicate "$sbom" "$ref"
          done
          echo "$repo@$digest" > "$RUNNER_TEMP/image-out/image-ref.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: ${{ runner.temp }}/image-out/*
          if-no-files-found: error

  release:
    name: Sign the artifacts and draft the release
    needs: [version, agent, manifest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Hash and sign
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          cd "$ASSETS"
          mv image-ref.txt "$RUNNER_TEMP/image-ref.txt"
          # SHA256SUMS lists every file, including the SBOMs. It is signed too.
          sha256sum -- * > SHA256SUMS
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/image-ref.txt")"
          sed -e "s|@VERSION@|$VERSION|g" -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$REPO|g" \
              -e "s|@IMAGE@|$image|g" .github/release-notes.md.tmpl > "$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          flags=(--draft --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "$ASSETS"/*
