name: Agent packages

# Build the agent package for each MVP platform. The package holds the agent,
# the license texts and the package hashes. It does not hold restic: the agent
# downloads and verifies restic itself (ADR-0038).
# The workflow builds artifacts only. The operator approves a release, so no job
# publishes one. The only deliverable artifacts are `restichub-agent-<os>-<arch>`.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary: target/release/restichub-agent
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary: target/release/restichub-agent
          - os: windows
            arch: amd64
            runner: windows-latest
            binary: target/release/restichub-agent.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Build the agent
        shell: bash
        run: |
          RESTICHUB_BUILD_VERSION="$(git rev-parse --short=7 HEAD)" cargo build --release -p restichub-agent
      # An input of the package job, not a deliverable. It expires after one day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediate-build-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.binary }}
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }}-${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intermediate-build-${{ matrix.os }}-${{ matrix.arch }}
          path: agent
      - name: Assemble the package
        id: assemble
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Cargo.lock holds the resolved version of the agent crate.
          version="$(awk -F'"' '/^name = "restichub-agent"$/{getline; print $2; exit}' Cargo.lock)"

          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ "$OS" = windows ]; then
            names=(restichub-agent.exe)
            cp agent/restichub-agent.exe "$stage/"
          else
            names=(restichub-agent)
            cp agent/restichub-agent "$stage/"
          fi
          cp LICENSE "$stage/LICENSE"
          cp packaging/THIRD_PARTY_NOTICES "$stage/THIRD_PARTY_NOTICES"
          ( cd "$stage" && sha256sum "${names[@]}" LICENSE THIRD_PARTY_NOTICES > SHA256SUMS )

          archive="$RUNNER_TEMP/restichub-agent-${version}-${OS}-${ARCH}"
          if [ "$OS" = windows ]; then
            archive="$archive.zip"
            ( cd "$stage" && zip -q -X "$archive" "${names[@]}" LICENSE THIRD_PARTY_NOTICES SHA256SUMS )
          else
            archive="$archive.tar.gz"
            tar -czf "$archive" -C "$stage" "${names[@]}" LICENSE THIRD_PARTY_NOTICES SHA256SUMS
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      # AC-IN-01: the package holds the agent, the license texts and the package
      # hashes, and it does not hold restic.
      - name: Verify the package (AC-IN-01)
        env:
          ARCHIVE: ${{ steps.assemble.outputs.archive }}
        run: packaging/verify-agent-package.sh --package "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restichub-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.assemble.outputs.archive }}
          if-no-files-found: error
