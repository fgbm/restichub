name: Agent packages

# Build the agent package for each MVP platform. The package holds the agent,
# the license texts and the package hashes. It does not hold restic: the agent
# downloads and verifies restic itself (ADR-0038).
# The workflow builds artifacts only; it does not run for a tag. The release
# workflow builds, signs and drafts the release packages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary: target/release/restichub-agent
            rustflags: ''
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary: target/release/restichub-agent
            rustflags: ''
          - os: windows
            arch: amd64
            runner: windows-latest
            binary: target/release/restichub-agent.exe
            # The agent must start on a host without the Visual C++ Redistributable.
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action reads rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Build the agent
        shell: bash
        env:
          EXTRA_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/build/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/build/rustup $EXTRA_RUSTFLAGS"
          RESTICHUB_BUILD_VERSION="$(git rev-parse --short=7 HEAD)" cargo build --release --locked -p restichub-agent
      # An input of the package job, not a deliverable. It expires after one day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediate-build-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.binary }}
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }}-${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intermediate-build-${{ matrix.os }}-${{ matrix.arch }}
          path: agent
      - name: Assemble the package
        id: assemble
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Cargo.lock holds the resolved version of the agent crate.
          version="$(awk -F'"' '/^name = "restichub-agent"$/{getline; print $2; exit}' Cargo.lock)"
          if [ "$OS" = windows ]; then binary=agent/restichub-agent.exe; else binary=agent/restichub-agent; fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          archive="$(packaging/assemble-agent-package.sh "$binary" "$OS" "$ARCH" "$version" "$RUNNER_TEMP/package")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      # AC-IN-01: the package holds the agent, the license texts and the package
      # hashes, and it does not hold restic.
      - name: Verify the package (AC-IN-01)
        env:
          ARCHIVE: ${{ steps.assemble.outputs.archive }}
        run: packaging/verify-agent-package.sh --package "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restichub-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.assemble.outputs.archive }}
          if-no-files-found: error

  # NFR-SEC-06: two builds of one commit in two directories give the same package.
  reproducible:
    name: Reproducible Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl
          cache: false
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the package twice and compare
        env:
          TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          revision="$(git rev-parse --short=7 HEAD)"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/copy"
          for dir in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/copy"; do
            ( cd "$dir"
              export RUSTFLAGS="--remap-path-prefix=${dir}=/build/src --remap-path-prefix=${CARGO_HOME}=/build/cargo --remap-path-prefix=${RUSTUP_HOME}=/build/rustup"
              RESTICHUB_BUILD_VERSION="$revision" cargo build --release --locked -p restichub-agent --target "$TARGET"
              packaging/assemble-agent-package.sh "target/$TARGET/release/restichub-agent" linux amd64 0.0.0 "$dir/package" )
          done
          a="$(sha256sum "$GITHUB_WORKSPACE"/package/*.tar.gz | cut -d' ' -f1)"
          b="$(sha256sum "$RUNNER_TEMP"/copy/package/*.tar.gz | cut -d' ' -f1)"
          echo "first:  $a"
          echo "second: $b"
          [ "$a" = "$b" ] || { echo "::error::the two builds differ"; exit 1; }
