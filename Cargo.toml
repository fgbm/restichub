[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/fgbm/restichub"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1.0"
argon2 = { version = "0.6", features = ["zeroize"] }
axum = "0.8"
base64 = "0.22"
ctrlc = { version = "3.5", features = ["termination"] }
getrandom = "0.4"
http-body-util = "0.1"
libc = "0.2"
rcgen = { version = "0.14", features = ["x509-parser"] }
restichub-common = { path = "crates/restichub-common" }
restichub-compiler = { path = "crates/restichub-compiler" }
restichub-db = { path = "crates/restichub-db" }
restichub-proto = { path = "crates/restichub-proto" }
restichub-secrets = { path = "crates/restichub-secrets" }
rust-embed = { version = "8", features = ["debug-embed"] }
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "json",
  "ipnet",
  "migrate",
  "macros",
] }
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
utoipa-axum = "0.3"
uuid = { version = "1.28", features = ["v7", "serde"] }
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
