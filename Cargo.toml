[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/fgbm/restichub"
publish = false

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
restichub-common = { path = "crates/restichub-common" }
restichub-compiler = { path = "crates/restichub-compiler" }
restichub-db = { path = "crates/restichub-db" }
restichub-proto = { path = "crates/restichub-proto" }
restichub-secrets = { path = "crates/restichub-secrets" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "migrate",
  "macros",
] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
uuid = { version = "1.28", features = ["v7", "serde"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
