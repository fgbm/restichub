[package]
name = "restichub-agent"
description = "ResticHub agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Runs an unpinned restic binary. A development build needs it because the build script holds no
# `RESTICHUB_RESTIC_SHA256`. Release CI never enables it (ADR-0031).
dev-unpinned-restic = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = "1.12"
ctrlc = { workspace = true }
http-body-util = { workspace = true }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
restichub-proto = { path = "../restichub-proto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = "1.12"
http-body-util = { workspace = true }
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
prost = "0.14"
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
restichub-cp = { path = "../restichub-cp" }
restichub-db = { workspace = true, features = ["test-util"] }
restichub-secrets = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["util"] }
x509-parser = { workspace = true }
