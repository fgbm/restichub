[package]
name = "restichub-agent"
description = "ResticHub agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = "1.12"
bzip2 = "0.6"
ctrlc = { workspace = true }
ed25519-dalek = "3.0"
getrandom = { workspace = true }
http-body-util = { workspace = true }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
ring = "0.17"
restichub-compiler = { workspace = true }
restichub-common = { path = "../restichub-common" }
restichub-proto = { path = "../restichub-proto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
toml = { workspace = true }
tonic = { version = "0.14", features = ["tls-ring"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = "1.12"
http-body-util = { workspace = true }
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
prost-types = "0.14"
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
restichub-canary-scan = { path = "../restichub-canary-scan" }
restichub-cp = { path = "../restichub-cp" }
restichub-db = { workspace = true, features = ["test-util"] }
restichub-secrets = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
x509-parser = { workspace = true }
