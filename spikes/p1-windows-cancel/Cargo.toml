[package]
name = "p1-cancel"
description = "Spike P1: cancel restic from a Windows service without a console"
version = "0.0.0"
edition = "2024"
publish = false

# The spike is a standalone project. This empty table keeps it out of the root
# workspace (the root members are crates/*).
[workspace]

[[bin]]
name = "p1-cancel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = "symbols"
