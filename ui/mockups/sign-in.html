<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sign in · ResticHub</title>
		<link rel="stylesheet" href="mockups.css" />
		<script src="mockups.js"></script>
	</head>
	<body>
		<div class="auth-topbar">
			<button class="btn btn--icon" data-theme-toggle aria-label="Switch theme">
				<svg class="icon"><use href="icons.svg#i-moon" /></svg>
			</button>
		</div>

		<div class="auth-shell">
			<div class="auth-card">
				<div class="auth-head">
					<span class="brandmark" style="width: 44px; height: 44px; border-radius: 11px">
						<svg viewBox="0 0 20 20" style="width: 26px; height: 26px">
							<path class="mark-solid" d="M10 2.5 2.5 6.4 10 10.3l7.5-3.9z" />
							<path d="M2.5 10.6 10 14.5l7.5-3.9" />
						</svg>
					</span>
					<div>
						<h1 class="page-title" style="justify-content: center">Sign in to ResticHub</h1>
						<p class="muted">Enter your tenant, user name and password.</p>
					</div>
				</div>

				<div class="form-box">
					<form class="stack">
						<label class="field">
							<span class="field-label">Tenant</span>
							<input class="input" value="acme" autocomplete="organization" />
						</label>
						<label class="field">
							<span class="field-label">User name</span>
							<input class="input" value="admin" autocomplete="username" />
						</label>
						<label class="field">
							<span class="field-label">Password</span>
							<span class="input-group">
								<input type="password" value="correct-horse-battery" autocomplete="current-password" />
								<button class="btn btn--ghost btn--icon btn--sm" type="button" aria-label="Show password" style="border-radius: 0"><svg class="icon"><use href="icons.svg#i-eye" /></svg></button>
							</span>
						</label>
						<div class="row" style="justify-content: space-between">
							<label class="checkbox"><input type="checkbox" checked /><span>Keep me signed in</span></label>
							<a href="#">Forgot password</a>
						</div>
						<button class="btn btn--primary btn--full" type="submit">Sign in</button>
					</form>
				</div>

				<p class="auth-foot">A session ends after 12 hours of inactivity.</p>
			</div>
		</div>
	</body>
</html>
