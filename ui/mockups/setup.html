<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Initial setup · ResticHub</title>
		<link rel="stylesheet" href="mockups.css" />
		<script src="mockups.js"></script>
	</head>
	<body>
		<div class="auth-topbar">
			<button class="btn btn--icon" data-theme-toggle aria-label="Switch theme">
				<svg class="icon"><use href="icons.svg#i-moon" /></svg>
			</button>
		</div>

		<div class="auth-shell">
			<div class="auth-card" style="max-width: 440px">
				<div class="auth-head">
					<span class="brandmark" style="width: 44px; height: 44px; border-radius: 11px">
						<svg viewBox="0 0 20 20" style="width: 26px; height: 26px">
							<path class="mark-solid" d="M10 2.5 2.5 6.4 10 10.3l7.5-3.9z" />
							<path d="M2.5 10.6 10 14.5l7.5-3.9" />
						</svg>
					</span>
					<div>
						<h1 class="page-title" style="justify-content: center">Initial setup</h1>
						<p class="muted">Create the first Platform Admin. Use the one-time setup token.</p>
					</div>
				</div>

				<div class="form-box">
					<div class="alert" style="margin-bottom: var(--space-4)">
						<svg class="icon icon--xs"><use href="icons.svg#i-info" /></svg>
						<span>The control plane wrote the setup token to its log. The token is valid one time only.</span>
					</div>
					<form class="stack">
						<label class="field">
							<span class="field-label">Setup token <span class="req">*</span></span>
							<input class="input mono" placeholder="setup token" />
							<span class="field-hint">The line with setup_token in the control plane log.</span>
						</label>
						<label class="field">
							<span class="field-label">User name <span class="req">*</span></span>
							<input class="input" value="admin" autocomplete="username" />
						</label>
						<label class="field">
							<span class="field-label">Display name</span>
							<input class="input" value="Anna Petrova" />
						</label>
						<label class="field">
							<span class="field-label">Password <span class="req">*</span></span>
							<input class="input" type="password" value="correct-horse-battery" autocomplete="new-password" />
							<span class="field-hint">Use 12 characters or more.</span>
						</label>
						<label class="field is-invalid">
							<span class="field-label">Confirm password <span class="req">*</span></span>
							<input class="input" type="password" value="correct-horse-batter" aria-invalid="true" autocomplete="new-password" />
							<span class="field-error"><svg class="icon icon--xs"><use href="icons.svg#i-alert" /></svg> The passwords do not match.</span>
						</label>
						<button class="btn btn--primary btn--full" type="submit">Create the Platform Admin</button>
					</form>
				</div>

				<p class="auth-foot"><a href="sign-in.html">Back to sign in</a></p>
			</div>
		</div>
	</body>
</html>
